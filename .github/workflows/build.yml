name: Build Funkin-Moon

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  HAXE_VERSION: "4.3.7"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"

jobs:

  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            git \
            curl \
            wget \
            zip \
            unzip \
            neko \
            libvlc-dev \
            libvlccore-dev \
            libdbus-1-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify environment
        run: |
          set -euxo pipefail

          haxe --version
          haxelib version
          neko -version

      - name: Install HMM
        run: |
          set -euxo pipefail

          haxelib install hmm --quiet

      - name: Install dependencies
        run: |
          set -euxo pipefail

          rm -rf .haxelib

          haxelib run hmm install

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          HXCPP=".haxelib/hxcpp/git"

          test -f "$HXCPP/tools/hxcpp/compile.hxml"

          cd "$HXCPP/tools/hxcpp"

          haxe compile.hxml

      - name: Rebuild Lime
        run: |
          set -euxo pipefail

          haxelib run lime rebuild cpp

      - name: Build Linux
        run: |
          set -euxo pipefail

          haxelib run lime build linux \
            -release \
            -64 \
            -DGITHUB_BUILD

      - name: Package Linux
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          test -d export

          cd export

          zip -r ../artifacts/Funkin-Moon-Linux.zip .

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Linux
          path: artifacts/Funkin-Moon-Linux.zip


  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          haxe --version
          haxelib version

      - name: Install HMM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          haxelib install hmm --quiet

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path ".haxelib") {
            Remove-Item ".haxelib" -Recurse -Force
          }

          haxelib run hmm install

      - name: Prepare hxcpp
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $HXCPP = ".haxelib/hxcpp/git"

          if (!(Test-Path "$HXCPP/tools/hxcpp/compile.hxml")) {
            throw "hxcpp compile.hxml was not found"
          }

          Set-Location "$HXCPP/tools/hxcpp"

          haxe compile.hxml

      - name: Rebuild Lime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          haxelib run lime rebuild cpp

      - name: Build Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          haxelib run lime build windows `
            -release `
            -64 `
            -DGITHUB_BUILD

      - name: Package Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force artifacts | Out-Null

          if (!(Test-Path "export")) {
            throw "Windows export directory was not generated"
          }

          Compress-Archive `
            -Path "export\*" `
            -DestinationPath "artifacts\Funkin-Moon-Windows.zip" `
            -Force

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Windows
          path: artifacts/Funkin-Moon-Windows.zip


  macos:
    name: macOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          set -euxo pipefail

          brew update

          brew install \
            pkg-config \
            neko \
            cmake \
            vlc

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify environment
        run: |
          set -euxo pipefail

          uname -m
          sw_vers
          xcodebuild -version
          haxe --version
          haxelib version
          neko -version

      - name: Install HMM
        run: |
          set -euxo pipefail

          haxelib install hmm --quiet

      - name: Install dependencies
        run: |
          set -euxo pipefail

          rm -rf .haxelib

          haxelib run hmm install

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          HXCPP=".haxelib/hxcpp/git"

          test -f "$HXCPP/tools/hxcpp/compile.hxml"

          cd "$HXCPP/tools/hxcpp"

          haxe compile.hxml

      - name: Rebuild Lime
        run: |
          set -euxo pipefail

          haxelib run lime rebuild cpp

      - name: Build macOS
        run: |
          set -euxo pipefail

          haxelib run lime build mac \
            -release \
            -64 \
            -DGITHUB_BUILD

      - name: Package macOS
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          test -d export

          APP="$(find export -type d -name "*.app" -print -quit 2>/dev/null || true)"

          if [ -n "$APP" ]; then
            cd "$(dirname "$APP")"

            zip -r \
              "$OLDPWD/artifacts/Funkin-Moon-macOS.zip" \
              "$(basename "$APP")"
          else
            cd export

            zip -r \
              ../artifacts/Funkin-Moon-macOS.zip \
              .
          fi

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-macOS
          path: artifacts/Funkin-Moon-macOS.zip


  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Detect Android NDK
        run: |
          set -euxo pipefail

          SDK="${ANDROID_SDK_ROOT}"
          NDK="${SDK}/ndk/${ANDROID_NDK_VERSION}"
          LLVM="${NDK}/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="${LLVM}/bin"

          test -d "$SDK"
          test -d "$NDK"
          test -d "$LLVM"
          test -d "$BIN"
          test -f "$NDK/source.properties"

          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_DIR=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_LLVM=$LLVM" >> "$GITHUB_ENV"
          echo "ANDROID_BIN=$BIN" >> "$GITHUB_ENV"

          echo "$BIN" >> "$GITHUB_PATH"

          echo "SDK:"
          printf '%s\n' "$SDK"

          echo "NDK:"
          printf '%s\n' "$NDK"

          echo "LLVM:"
          printf '%s\n' "$LLVM"

      - name: Discover Android headers
        run: |
          set -u

          echo "Searching for stdlib.h..."

          FOUND=""

          while IFS= read -r file; do
            FOUND="$file"
            break
          done < <(
            find "$ANDROID_NDK_DIR" \
              -type f \
              -name "stdlib.h" \
              -print 2>/dev/null
          )

          if [ -z "$FOUND" ]; then
            echo "stdlib.h was not found inside the NDK"
            exit 1
          fi

          echo "stdlib.h:"
          printf '%s\n' "$FOUND"

          STDROOT="$(dirname "$FOUND")"

          echo "ANDROID_C_INCLUDE=$STDROOT" >> "$GITHUB_ENV"

      - name: Verify Android Clang
        run: |
          set -euxo pipefail

          CLANG="$ANDROID_BIN/aarch64-linux-android35-clang"
          CLANGXX="$ANDROID_BIN/aarch64-linux-android35-clang++"

          test -x "$CLANG"
          test -x "$CLANGXX"

          "$CLANG" --version
          "$CLANGXX" --version

      - name: Create Android compatibility compilers
        run: |
          set -euxo pipefail

          CLANG="$ANDROID_BIN/aarch64-linux-android35-clang"
          CLANGXX="$ANDROID_BIN/aarch64-linux-android35-clang++"

          ln -sf "$CLANG" "$ANDROID_BIN/aarch64-linux-android-gcc"
          ln -sf "$CLANGXX" "$ANDROID_BIN/aarch64-linux-android-g++"

          ln -sf "$CLANG" "$ANDROID_BIN/aarch64-linux-android-gcc-35"
          ln -sf "$CLANGXX" "$ANDROID_BIN/aarch64-linux-android-g++-35"

          command -v aarch64-linux-android-gcc
          command -v aarch64-linux-android-g++

      - name: Install native dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            git \
            curl \
            wget \
            zip \
            unzip \
            neko \
            libvlc-dev \
            libvlccore-dev \
            libdbus-1-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Haxe
        run: |
          set -euxo pipefail

          haxe --version
          haxelib version
          neko -version

      - name: Install HMM
        run: |
          set -euxo pipefail

          haxelib install hmm --quiet

      - name: Install Haxe dependencies
        run: |
          set -euxo pipefail

          rm -rf .haxelib

          haxelib run hmm install

      - name: Show dependencies
        run: |
          set -euxo pipefail

          haxelib list

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          HXCPP=".haxelib/hxcpp/git"

          test -d "$HXCPP"
          test -f "$HXCPP/tools/hxcpp/compile.hxml"

          cd "$HXCPP/tools/hxcpp"

          haxe compile.hxml

      - name: Rebuild Lime C++
        env:
          CFLAGS: "-O3"
          CXXFLAGS: "-O3 -std=c++20"
        run: |
          set -euxo pipefail

          haxelib run lime rebuild cpp

      - name: Configure Lime Android
        run: |
          set -euxo pipefail

          printf "n\n%s\n%s\n%s\n" \
            "$ANDROID_SDK" \
            "$ANDROID_NDK_DIR" \
            "$JAVA_HOME" \
            | haxelib run lime setup android || true

      - name: Restore Android configuration
        run: |
          set -euxo pipefail

          echo "SDK=$ANDROID_SDK"
          echo "NDK=$ANDROID_NDK_DIR"
          echo "LLVM=$ANDROID_LLVM"
          echo "BIN=$ANDROID_BIN"

          test -d "$ANDROID_SDK"
          test -d "$ANDROID_NDK_DIR"
          test -d "$ANDROID_LLVM"
          test -d "$ANDROID_BIN"

          export ANDROID_SDK
          export ANDROID_HOME="$ANDROID_SDK"
          export ANDROID_NDK_DIR
          export ANDROID_NDK_ROOT="$ANDROID_NDK_DIR"
          export ANDROID_NDK_HOME="$ANDROID_NDK_DIR"

          export PATH="$ANDROID_BIN:$PATH"

          aarch64-linux-android35-clang --version
          aarch64-linux-android35-clang++ --version

      - name: Test Android compiler
        run: |
          set -euxo pipefail

          export PATH="$ANDROID_BIN:$PATH"

          cat > /tmp/funkin_test.cpp <<'EOF'
          #include <stdlib.h>
          #include <stdint.h>
          #include <stddef.h>

          int main()
          {
            return 0;
          }
          EOF

          aarch64-linux-android35-clang++ \
            --target=aarch64-linux-android28 \
            -std=c++20 \
            -c \
            /tmp/funkin_test.cpp \
            -o /tmp/funkin_test.o

          test -f /tmp/funkin_test.o

      - name: Rebuild Lime Android
        env:
          CFLAGS: "-O3"
          CXXFLAGS: "-O3 -std=c++20"
        run: |
          set -euxo pipefail

          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_DIR="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"

          export PATH="$ANDROID_BIN:$PATH"

          export CC="aarch64-linux-android35-clang"
          export CXX="aarch64-linux-android35-clang++"

          haxelib run lime rebuild android

      - name: Build Android
        env:
          CFLAGS: "-O3"
          CXXFLAGS: "-O3 -std=c++20"
        run: |
          set -euxo pipefail

          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_DIR="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"

          export PATH="$ANDROID_BIN:$PATH"

          export CC="aarch64-linux-android35-clang"
          export CXX="aarch64-linux-android35-clang++"

          haxelib run lime build android \
            -release \
            -DGITHUB_BUILD

      - name: Locate APK
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          APK=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              APK="$file"
              break
            fi
          done < <(
            find export . \
              -type f \
              -name "*.apk" \
              -print 2>/dev/null
          )

          if [ -z "$APK" ]; then
            echo "APK not found"

            find export \
              -maxdepth 8 \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "APK: $APK"

          cp "$APK" artifacts/Funkin-Moon.apk

      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Android
          path: artifacts/Funkin-Moon.apk


  ios:
    name: iOS
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify environment
        run: |
          set -euxo pipefail

          uname -m
          sw_vers
          xcodebuild -version
          haxe --version
          haxelib version

      - name: Install HMM
        run: |
          set -euxo pipefail

          haxelib install hmm --quiet

      - name: Install dependencies
        run: |
          set -euxo pipefail

          rm -rf .haxelib

          haxelib run hmm install

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          HXCPP=".haxelib/hxcpp/git"

          test -f "$HXCPP/tools/hxcpp/compile.hxml"

          cd "$HXCPP/tools/hxcpp"

          haxe compile.hxml

      - name: Rebuild Lime
        run: |
          set -euxo pipefail

          haxelib run lime rebuild cpp

      - name: Setup iOS
        run: |
          set -euxo pipefail

          haxelib run lime setup ios || true

      - name: Build iOS
        run: |
          set -euxo pipefail

          haxelib run lime build ios \
            -release \
            -DGITHUB_BUILD

      - name: Package iOS
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          IPA="$(find export . -type f -name "*.ipa" -print -quit 2>/dev/null || true)"

          if [ -n "$IPA" ]; then
            cp "$IPA" artifacts/Funkin-Moon-iOS.ipa
          else
            APP="$(find export . -type d -name "*.app" -print -quit 2>/dev/null || true)"

            if [ -z "$APP" ]; then
              echo "iOS application was not generated"
              find export -maxdepth 8 -print 2>/dev/null || true
              exit 1
            fi

            cd "$(dirname "$APP")"

            zip -r \
              "$OLDPWD/artifacts/Funkin-Moon-iOS.app.zip" \
              "$(basename "$APP")"
          fi

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-iOS
          path: artifacts/*
