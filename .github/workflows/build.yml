ios:
name: iOS
runs-on: macos-15-intel

steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      submodules: recursive

  - name: Setup Haxe
    uses: krdlab/setup-haxe@v2
    with:
      haxe-version: ${{ env.HAXE_VERSION }}

  - name: Configure Haxelib
    shell: bash
    run: |
      set -euxo pipefail
      haxelib --never newrepo
      echo "HAXEPATH=$(haxelib config)" >> "$GITHUB_ENV"

  - name: Install HMM
    shell: bash
    run: |
      set -euxo pipefail
      haxelib install hmm --quiet

  - name: Install project dependencies
    shell: bash
    run: |
      set -euxo pipefail
      haxelib run hmm install -q
      haxelib fixrepo

  - name: Diagnostics
    shell: bash
    run: |
      set -euxo pipefail
      uname -m
      sw_vers
      xcodebuild -version
      haxe --version
      haxelib config
