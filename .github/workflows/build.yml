      - name: Configure Haxelib
        run: |
          set -euxo pipefail

          rm -rf .haxelib
          haxelib --never newrepo

      - name: Install HMM
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          haxelib install hmm "$HMM_VERSION" --quiet
          HAXEPATH="$(haxelib config)" \
            haxelib run hmm help

      - name: Install dependencies
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          HAXEPATH="$(haxelib config)" \
            haxelib run hmm install --force

      - name: Inspect dependencies
        run: |
          set -euxo pipefail

          haxelib list

          test -d ".haxelib/hxcpp/git"
          test -d ".haxelib/lime/git"

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          cd ".haxelib/hxcpp/git/tools/hxcpp"

          haxe compile.hxml

      - name: Clean Lime iOS
        run: |
          rm -rf .haxelib/lime/git/ndll/iPhone
          rm -rf .haxelib/lime/git/ndll/iPhone64
          rm -rf .haxelib/lime/git/ndll/iPhoneARM64

      - name: Setup Lime iOS
        run: |
          haxelib run lime setup ios || true

      - name: Rebuild Lime iOS
        run: |
          set -euxo pipefail

          haxelib run lime rebuild ios -clean

      - name: Build iOS
        run: |
          set -euxo pipefail

          haxelib run lime build ios \
            -release \
            -DGITHUB_BUILD

      - name: Package iOS
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          IPA="$(find . \
            -type f \
            -name "*.ipa" \
            | head -1)"

          if [ -n "$IPA" ]; then
            cp "$IPA" "artifacts/Funkin-Moon-iOS.ipa"
          else
            APP="$(find . \
              -type d \
              -name "*.app" \
              | head -1)"

            if [ -z "$APP" ]; then
              echo "No iOS application was generated"
              exit 1
            fi

            ditto \
              -c \
              -k \
              --sequesterRsrc \
              --keepParent \
              "$APP" \
              "artifacts/Funkin-Moon-iOS.app.zip"
          fi

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-iOS
          path: artifacts/*
