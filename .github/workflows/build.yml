name: Build Funkin-Moon

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HAXE_VERSION: "4.3.7"
  HMM_VERSION: "3.1.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  HXCPP_VERBOSE: "1"
  HAXE_NO_COLOR: "1"
  CXXFLAGS: "-O3 -std=c++20"
  CPPFLAGS: "-O3"

jobs:

  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            unzip \
            zip \
            pkg-config \
            cmake \
            ninja-build \
            neko \
            libvlc-dev \
            libvlccore-dev \
            libdbus-1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Configure Haxe
        run: |
          set -euxo pipefail

          HAXE_BIN="$(command -v haxe)"
          HAXE_DIR="$(dirname "$HAXE_BIN")"

          HAXELIB_CONFIG="$(haxelib config)"

          echo "HAXEPATH=$HAXE_DIR" >> "$GITHUB_ENV"

          unset HAXE_STD_PATH
          echo "HAXE_STD_PATH=" >> "$GITHUB_ENV"

          echo "Haxe executable:"
          which haxe

          echo "Haxe version:"
          haxe --version

          echo "Haxelib:"
          haxelib version

          echo "Haxelib config:"
          echo "$HAXELIB_CONFIG"

      - name: Validate Haxe
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          haxe --version
          haxelib version

          HAXEPATH="$HAXEPATH" haxe --version

      - name: Configure local Haxelib repository
        run: |
          set -euxo pipefail

          rm -rf .haxelib

          haxelib --never newrepo

          test -d ".haxelib"

      - name: Install HMM
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          haxelib install hmm "$HMM_VERSION" --quiet

          HAXEPATH="$HAXEPATH" \
          haxelib run hmm help

      - name: Install project dependencies
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          HAXEPATH="$HAXEPATH" \
          haxelib run hmm install --force

      - name: Inspect installed libraries
        run: |
          set -euxo pipefail

          haxelib list

          test -d ".haxelib/hxcpp/git"
          test -d ".haxelib/lime/git"

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          HXCPP_TOOLS=".haxelib/hxcpp/git/tools/hxcpp"

          test -d "$HXCPP_TOOLS"

          cd "$HXCPP_TOOLS"

          HAXEPATH="$HAXEPATH" \
          haxe compile.hxml

      - name: Rebuild Lime
        run: |
          set -euxo pipefail

          haxelib run lime rebuild linux -clean

      - name: Verify Lime
        run: |
          set -euxo pipefail

          find ".haxelib/lime/git/ndll" \
            -type f \
            -name "lime.ndll" \
            -print

          test -f ".haxelib/lime/git/ndll/Linux64/lime.ndll"

      - name: Build Linux
        run: |
          set -euxo pipefail

          haxelib run lime build linux \
            -release \
            -64 \
            -DGITHUB_BUILD

      - name: Package Linux
        run: |
          set -euxo pipefail

          if [ -d "export/linux/bin" ]; then
            cd export/linux/bin
            zip -r ../../../Funkin-Moon-Linux.zip .
          elif [ -d "export/linux" ]; then
            cd export/linux
            zip -r ../../Funkin-Moon-Linux.zip .
          else
            echo "Linux export directory not found"
            find export -maxdepth 6 -print
            exit 1
          fi

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Linux
          path: Funkin-Moon-Linux.zip


  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Configure Haxe
        shell: pwsh
        run: |
          $Haxe = (Get-Command haxe).Source
          $HaxeDir = Split-Path $Haxe

          "HAXEPATH=$HaxeDir" | Out-File $env:GITHUB_ENV -Append
          "HAXE_STD_PATH=" | Out-File $env:GITHUB_ENV -Append

          Write-Host "Haxe: $Haxe"
          Write-Host "HAXEPATH: $HaxeDir"

          haxe --version
          haxelib version

      - name: Configure local Haxelib repository
        shell: pwsh
        run: |
          if (Test-Path ".haxelib") {
            Remove-Item ".haxelib" -Recurse -Force
          }

          haxelib --never newrepo

      - name: Install HMM
        shell: pwsh
        run: |
          $env:HAXE_STD_PATH = ""

          haxelib install hmm $env:HMM_VERSION --quiet
          haxelib run hmm help

      - name: Install project dependencies
        shell: pwsh
        run: |
          $env:HAXE_STD_PATH = ""

          haxelib run hmm install --force

      - name: Inspect libraries
        shell: pwsh
        run: |
          haxelib list

          if (!(Test-Path ".haxelib/hxcpp/git")) {
            Write-Error "hxcpp not installed"
            exit 1
          }

          if (!(Test-Path ".haxelib/lime/git")) {
            Write-Error "lime not installed"
            exit 1
          }

      - name: Prepare hxcpp
        shell: pwsh
        run: |
          $env:HAXE_STD_PATH = ""

          Push-Location ".haxelib/hxcpp/git/tools/hxcpp"

          haxe compile.hxml

          Pop-Location

      - name: Rebuild Lime
        shell: pwsh
        run: |
          haxelib run lime rebuild windows -clean

      - name: Verify Lime
        shell: pwsh
        run: |
          Get-ChildItem ".haxelib/lime/git/ndll" -Recurse -Filter "lime.ndll"

          if (!(Test-Path ".haxelib/lime/git/ndll/Windows64/lime.ndll")) {
            Write-Error "Windows64 lime.ndll not generated"
            exit 1
          }

      - name: Build Windows
        shell: pwsh
        run: |
          haxelib run lime build windows `
            -release `
            -64 `
            -DGITHUB_BUILD

      - name: Package Windows
        shell: pwsh
        run: |
          if (Test-Path "export/windows/bin") {
            Compress-Archive `
              -Path "export/windows/bin/*" `
              -DestinationPath "Funkin-Moon-Windows.zip" `
              -Force
          } elseif (Test-Path "export/windows") {
            Compress-Archive `
              -Path "export/windows/*" `
              -DestinationPath "Funkin-Moon-Windows.zip" `
              -Force
          } else {
            Write-Error "Windows export directory not found"
            exit 1
          }

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Windows
          path: Funkin-Moon-Windows.zip


  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          set -euxo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          yes | sdkmanager --licenses || true

      - name: Configure Android toolchain
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"
          NDK="$SDK/ndk/$ANDROID_NDK_VERSION"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="$LLVM/bin"

          test -f "$NDK/source.properties"
          test -d "$LLVM"
          test -d "$BIN"

          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_DIR=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_LLVM=$LLVM" >> "$GITHUB_ENV"

          echo "$BIN" >> "$GITHUB_PATH"

          echo "SDK=$SDK"
          echo "NDK=$NDK"
          echo "LLVM=$LLVM"

      - name: Verify Android compiler
        run: |
          set -euxo pipefail

          command -v aarch64-linux-android35-clang
          command -v aarch64-linux-android35-clang++

          aarch64-linux-android35-clang --version
          aarch64-linux-android35-clang++ --version

      - name: Create Android compiler aliases
        run: |
          set -euxo pipefail

          BIN="$ANDROID_LLVM/bin"

          ln -sf \
            "$BIN/aarch64-linux-android35-clang" \
            "$BIN/aarch64-linux-android-gcc"

          ln -sf \
            "$BIN/aarch64-linux-android35-clang++" \
            "$BIN/aarch64-linux-android-g++"

          ln -sf \
            "$BIN/armv7a-linux-androideabi35-clang" \
            "$BIN/arm-linux-androideabi-gcc"

          ln -sf \
            "$BIN/armv7a-linux-androideabi35-clang++" \
            "$BIN/arm-linux-androideabi-g++"

          aarch64-linux-android-g++ --version

      - name: Test Android headers
        run: |
          set -euxo pipefail

          find "$ANDROID_NDK_DIR" \
            -type f \
            -name "stdlib.h" \
            -print | head -20

          find "$ANDROID_NDK_DIR" \
            -type f \
            -name "stdint.h" \
            -print | head -20

          find "$ANDROID_NDK_DIR" \
            -type f \
            -name "stddef.h" \
            -print | head -20

      - name: Test Android C++ compiler
        run: |
          set -euxo pipefail

          cat > /tmp/funkin_test.cpp <<'EOF'
          #include <stdlib.h>
          #include <stdint.h>
          #include <stddef.h>

          int main() {
            return 0;
          }
          EOF

          aarch64-linux-android35-clang++ \
            --target=aarch64-linux-android28 \
            -std=c++20 \
            -O3 \
            -c \
            /tmp/funkin_test.cpp \
            -o /tmp/funkin_test.o

          file /tmp/funkin_test.o

      - name: Install native dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            unzip \
            zip \
            pkg-config \
            cmake \
            ninja-build \
            neko \
            libdbus-1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Configure Haxe
        run: |
          set -euxo pipefail

          HAXE_BIN="$(command -v haxe)"
          HAXE_DIR="$(dirname "$HAXE_BIN")"

          echo "HAXEPATH=$HAXE_DIR" >> "$GITHUB_ENV"
          echo "HAXE_STD_PATH=" >> "$GITHUB_ENV"

          haxe --version
          haxelib version

      - name: Configure local Haxelib
        run: |
          set -euxo pipefail

          rm -rf .haxelib
          haxelib --never newrepo

      - name: Install HMM
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          haxelib install hmm "$HMM_VERSION" --quiet
          haxelib run hmm help

      - name: Install project dependencies
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          haxelib run hmm install --force

      - name: Verify dependencies
        run: |
          set -euxo pipefail

          haxelib list

          test -d ".haxelib/hxcpp/git"
          test -d ".haxelib/lime/git"

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          cd ".haxelib/hxcpp/git/tools/hxcpp"

          haxe compile.hxml

      - name: Clean Lime
        run: |
          rm -rf .haxelib/lime/git/ndll/Android
          rm -rf .haxelib/lime/git/ndll/Android64
          rm -rf .haxelib/lime/git/ndll/Android-arm64
          rm -rf .haxelib/lime/git/ndll/Android64-arm64

      - name: Rebuild Lime C++
        run: |
          set -euxo pipefail

          haxelib run lime rebuild cpp -clean

      - name: Configure Lime Android
        run: |
          set -euxo pipefail

          printf "n\n%s\n%s\n%s\n" \
            "$ANDROID_SDK" \
            "$ANDROID_NDK_DIR" \
            "$JAVA_HOME" \
            | haxelib run lime setup android

      - name: Restore Android environment
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_DIR=$ANDROID_NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_LLVM/bin" >> "$GITHUB_PATH"

      - name: Rebuild Lime Android
        run: |
          set -euxo pipefail

          haxelib run lime rebuild android -clean

      - name: Verify Android Lime
        run: |
          set -euxo pipefail

          find ".haxelib/lime/git/ndll" \
            -type f \
            \( -name "liblime*.so" -o -name "lime.ndll" \) \
            -print

      - name: Build Android
        run: |
          set -euxo pipefail

          haxelib run lime build android \
            -release \
            -DGITHUB_BUILD

      - name: Locate APK
        run: |
          set -euxo pipefail

          find . \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Android
          path: "**/*.apk"


  macos:
    name: macOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update
          brew install \
            pkg-config \
            neko \
            cmake \
            ninja \
            vlc

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Configure Haxe
        run: |
          set -euxo pipefail

          HAXE_BIN="$(command -v haxe)"
          HAXE_DIR="$(dirname "$HAXE_BIN")"

          echo "HAXEPATH=$HAXE_DIR" >> "$GITHUB_ENV"
          echo "HAXE_STD_PATH=" >> "$GITHUB_ENV"

          haxe --version
          haxelib version

      - name: Configure Haxelib
        run: |
          rm -rf .haxelib
          haxelib --never newrepo

      - name: Install HMM
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          haxelib install hmm "$HMM_VERSION" --quiet
          haxelib run hmm help

      - name: Install project dependencies
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          haxelib run hmm install --force

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          cd ".haxelib/hxcpp/git/tools/hxcpp"

          haxe compile.hxml

      - name: Clean Lime
        run: |
          rm -rf .haxelib/lime/git/ndll/Mac
          rm -rf .haxelib/lime/git/ndll/Mac64
          rm -rf .haxelib/lime/git/ndll/MacARM64

      - name: Rebuild Lime macOS
        run: |
          set -euxo pipefail

          haxelib run lime rebuild mac -64 -clean

      - name: Verify Lime macOS
        run: |
          set -euxo pipefail

          find ".haxelib/lime/git/ndll" \
            -type f \
            -name "lime.ndll" \
            -print

          test -f ".haxelib/lime/git/ndll/Mac64/lime.ndll"

      - name: Build macOS
        run: |
          set -euxo pipefail

          haxelib run lime build mac \
            -release \
            -64 \
            -DGITHUB_BUILD

      - name: Package macOS
        run: |
          set -euxo pipefail

          APP="$(find export \
            -type d \
            -name "*.app" \
            | head -1)"

          if [ -z "$APP" ]; then
            echo "macOS application not found"
            find export -maxdepth 6 -print
            exit 1
          fi

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "Funkin-Moon-macOS.zip"

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-macOS
          path: Funkin-Moon-macOS.zip


  ios:
    name: iOS
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Configure Haxe
        run: |
          set -euxo pipefail

          HAXE_BIN="$(command -v haxe)"
          HAXE_DIR="$(dirname "$HAXE_BIN")"

          echo "HAXEPATH=$HAXE_DIR" >> "$GITHUB_ENV"
          echo "HAXE_STD_PATH=" >> "$GITHUB_ENV"

          haxe --version
          haxelib version

      - name: Configure Haxelib
        run: |
          rm -rf .haxelib
          haxelib --never newrepo

      - name: Install HMM
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          haxelib install hmm "$HMM_VERSION" --quiet
          haxelib run hmm help

      - name: Install project dependencies
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          haxelib run hmm install --force

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          cd ".haxelib/hxcpp/git/tools/hxcpp"

          haxe compile.hxml

      - name: Clean Lime
        run: |
          rm -rf .haxelib/lime/git/ndll/iPhone
          rm -rf .haxelib/lime/git/ndll/iPhone64
          rm -rf .haxelib/lime/git/ndll/iPhoneARM64

      - name: Setup Lime iOS
        run: |
          haxelib run lime setup ios || true

      - name: Rebuild Lime iOS
        run: |
          set -euxo pipefail

          haxelib run lime rebuild ios -clean

      - name: Build iOS
        run: |
          set -euxo pipefail

          haxelib run lime build ios \
            -release \
            -DGITHUB_BUILD

      - name: Package iOS
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          IPA="$(find . \
            -type f \
            -name "*.ipa" \
            | head -1)"

          if [ -n "$IPA" ]; then
            cp "$IPA" "artifacts/Funkin-Moon-iOS.ipa"
          else
            APP="$(find . \
              -type d \
              -name "*.app" \
              | head -1)"

            if [ -z "$APP" ]; then
              echo "No iOS application was generated"
              exit 1
            fi

            ditto \
              -c \
              -k \
              --sequesterRsrc \
              --keepParent \
              "$APP" \
              "artifacts/Funkin-Moon-iOS.app.zip"
          fi

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-iOS
          path: artifacts/*
