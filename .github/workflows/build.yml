name: Build Funkin-Moon

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HAXE_VERSION: "4.3.7"
  HMM_VERSION: "3.1.0"

  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"

  HXCPP_VERBOSE: "1"
  HAXE_NO_COLOR: "1"

  CFLAGS: "-O3"
  CXXFLAGS: "-O3 -std=c++20"

jobs:

  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            unzip \
            zip \
            pkg-config \
            cmake \
            ninja-build \
            neko \
            libvlc-dev \
            libvlccore-dev \
            libdbus-1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Initialize Haxe environment
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          HAXE_BIN="$(command -v haxe)"
          HAXE_LIB="$(command -v haxelib)"
          HAXE_REPO="$(haxelib config)"

          echo "HAXEPATH=$HAXE_REPO" >> "$GITHUB_ENV"
          echo "HAXE_STD_PATH=" >> "$GITHUB_ENV"

          echo "========================================"
          echo "HAXE INFORMATION"
          echo "========================================"

          echo "Haxe executable: $HAXE_BIN"
          echo "Haxelib executable: $HAXE_LIB"
          echo "Haxelib repository: $HAXE_REPO"

          haxe --version
          haxelib version
          haxelib config

          echo "========================================"
          echo "HAXE INSTALLATION"
          echo "========================================"

          "$HAXE_BIN" -v 2>&1 | head -40 || true

      - name: Verify Haxe standard library
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          cat > /tmp/haxe_test.hx <<'EOF'
          class HaxeTest {
            static function main() {
              var value:Array<Int> = [1, 2, 3];
              Sys.println(value.length);
            }
          }
          EOF

          haxe -main HaxeTest \
            -cp /tmp \
            --interp

      - name: Configure Haxelib
        run: |
          set -euxo pipefail

          rm -rf .haxelib

          haxelib --never newrepo

          echo "Project Haxelib:"
          haxelib config

      - name: Install HMM
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          haxelib install hmm "$HMM_VERSION" --quiet

          HAXEPATH="$(haxelib config)" \
            haxelib run hmm help

      - name: Install project dependencies
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          HAXEPATH="$(haxelib config)" \
            haxelib run hmm install --force

      - name: Inspect dependencies
        run: |
          set -euxo pipefail

          haxelib list

          echo "hxcpp:"
          ls -la .haxelib/hxcpp/git || true

          echo "lime:"
          ls -la .haxelib/lime/git || true

          test -d ".haxelib/hxcpp/git"
          test -d ".haxelib/lime/git"

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          HAXEPATH="$(haxelib config)"

          cd ".haxelib/hxcpp/git/tools/hxcpp"

          haxe compile.hxml

      - name: Verify hxcpp tools
        run: |
          set -euxo pipefail

          find ".haxelib/hxcpp/git/tools/hxcpp" \
            -maxdepth 3 \
            -type f \
            -executable \
            -print || true

      - name: Rebuild Lime
        run: |
          set -euxo pipefail

          haxelib run lime rebuild linux -clean

      - name: Verify Lime
        run: |
          set -euxo pipefail

          find ".haxelib/lime/git/ndll" \
            -type f \
            -name "lime.ndll" \
            -print

          test -f ".haxelib/lime/git/ndll/Linux64/lime.ndll"

      - name: Build Linux
        run: |
          set -euxo pipefail

          haxelib run lime build linux \
            -release \
            -64 \
            -DGITHUB_BUILD

      - name: Package Linux
        run: |
          set -euxo pipefail

          if [ -d "export/linux/bin" ]; then
            cd export/linux/bin
            zip -r ../../../Funkin-Moon-Linux.zip .
          elif [ -d "export/linux" ]; then
            cd export/linux
            zip -r ../../Funkin-Moon-Linux.zip .
          else
            echo "Linux export directory not found"
            find export -maxdepth 6 -print
            exit 1
          fi

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Linux
          path: Funkin-Moon-Linux.zip


  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Initialize Haxe environment
        shell: pwsh
        run: |
          $HaxeRepo = haxelib config

          "HAXEPATH=$HaxeRepo" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          "HAXE_STD_PATH=" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          Write-Host "Haxe:"
          haxe --version

          Write-Host "Haxelib:"
          haxelib version

          Write-Host "Haxelib repository:"
          haxelib config

      - name: Verify Haxe
        shell: pwsh
        run: |
          Remove-Item Env:HAXE_STD_PATH -ErrorAction SilentlyContinue

          $testFile = Join-Path $env:TEMP "HaxeTest.hx"

          @"
          class HaxeTest {
            static function main() {
              var value:Array<Int> = [1, 2, 3];
              Sys.println(value.length);
            }
          }
          "@ | Set-Content $testFile

          haxe -main HaxeTest `
            -cp $env:TEMP `
            --interp

      - name: Configure Haxelib
        shell: pwsh
        run: |
          if (Test-Path ".haxelib") {
            Remove-Item ".haxelib" -Recurse -Force
          }

          haxelib --never newrepo

      - name: Install HMM
        shell: pwsh
        run: |
          Remove-Item Env:HAXE_STD_PATH -ErrorAction SilentlyContinue

          haxelib install hmm $env:HMM_VERSION --quiet

          $env:HAXEPATH = haxelib config

          haxelib run hmm help

      - name: Install project dependencies
        shell: pwsh
        run: |
          Remove-Item Env:HAXE_STD_PATH -ErrorAction SilentlyContinue

          $env:HAXEPATH = haxelib config

          haxelib run hmm install --force

      - name: Inspect dependencies
        shell: pwsh
        run: |
          haxelib list

          if (!(Test-Path ".haxelib/hxcpp/git")) {
            Write-Error "hxcpp was not installed"
            exit 1
          }

          if (!(Test-Path ".haxelib/lime/git")) {
            Write-Error "lime was not installed"
            exit 1
          }

      - name: Prepare hxcpp
        shell: pwsh
        run: |
          Remove-Item Env:HAXE_STD_PATH -ErrorAction SilentlyContinue

          $env:HAXEPATH = haxelib config

          Push-Location ".haxelib/hxcpp/git/tools/hxcpp"

          haxe compile.hxml

          Pop-Location

      - name: Rebuild Lime
        shell: pwsh
        run: |
          haxelib run lime rebuild windows -clean

      - name: Verify Lime
        shell: pwsh
        run: |
          Get-ChildItem `
            ".haxelib/lime/git/ndll" `
            -Recurse `
            -Filter "lime.ndll"

          if (!(Test-Path ".haxelib/lime/git/ndll/Windows64/lime.ndll")) {
            Write-Error "Windows64 lime.ndll was not generated"
            exit 1
          }

      - name: Build Windows
        shell: pwsh
        run: |
          haxelib run lime build windows `
            -release `
            -64 `
            -DGITHUB_BUILD

      - name: Package Windows
        shell: pwsh
        run: |
          if (Test-Path "export/windows/bin") {
            Compress-Archive `
              -Path "export/windows/bin/*" `
              -DestinationPath "Funkin-Moon-Windows.zip" `
              -Force
          } elseif (Test-Path "export/windows") {
            Compress-Archive `
              -Path "export/windows/*" `
              -DestinationPath "Funkin-Moon-Windows.zip" `
              -Force
          } else {
            Write-Error "Windows export directory not found"
            exit 1
          }

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Windows
          path: Funkin-Moon-Windows.zip


  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          set -euxo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          yes | sdkmanager --licenses || true

      - name: Configure Android
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"
          NDK="$SDK/ndk/$ANDROID_NDK_VERSION"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="$LLVM/bin"

          test -f "$NDK/source.properties"
          test -d "$LLVM"
          test -d "$BIN"

          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_DIR=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "ANDROID_LLVM=$LLVM" >> "$GITHUB_ENV"

          echo "$BIN" >> "$GITHUB_PATH"

          echo "SDK=$SDK"
          echo "NDK=$NDK"
          echo "LLVM=$LLVM"

      - name: Verify Android NDK
        run: |
          set -euxo pipefail

          cat "$ANDROID_NDK_DIR/source.properties"

          test -x \
            "$ANDROID_LLVM/bin/aarch64-linux-android35-clang"

          test -x \
            "$ANDROID_LLVM/bin/aarch64-linux-android35-clang++"

          "$ANDROID_LLVM/bin/aarch64-linux-android35-clang" \
            --version

          "$ANDROID_LLVM/bin/aarch64-linux-android35-clang++" \
            --version

      - name: Discover Android C headers
        run: |
          set -euxo pipefail

          echo "stdlib.h:"
          find "$ANDROID_NDK_DIR" \
            -type f \
            -name "stdlib.h" \
            -print \
            | head -30

          echo "stdint.h:"
          find "$ANDROID_NDK_DIR" \
            -type f \
            -name "stdint.h" \
            -print \
            | head -30

          echo "stddef.h:"
          find "$ANDROID_NDK_DIR" \
            -type f \
            -name "stddef.h" \
            -print \
            | head -30

      - name: Create Android compiler aliases
        run: |
          set -euxo pipefail

          BIN="$ANDROID_LLVM/bin"

          ln -sf \
            "$BIN/aarch64-linux-android35-clang" \
            "$BIN/aarch64-linux-android-gcc"

          ln -sf \
            "$BIN/aarch64-linux-android35-clang++" \
            "$BIN/aarch64-linux-android-g++"

          ln -sf \
            "$BIN/armv7a-linux-androideabi35-clang" \
            "$BIN/arm-linux-androideabi-gcc"

          ln -sf \
            "$BIN/armv7a-linux-androideabi35-clang++" \
            "$BIN/arm-linux-androideabi-g++"

          aarch64-linux-android-g++ --version

      - name: Test Android standard headers
        run: |
          set -euxo pipefail

          cat > /tmp/funkin_android_test.cpp <<'EOF'
          #include <stdlib.h>
          #include <stdint.h>
          #include <stddef.h>
          #include <string.h>

          int main() {
            void* p = malloc(16);

            if (p != nullptr) {
              memset(p, 0, 16);
              free(p);
            }

            return 0;
          }
          EOF

          "$ANDROID_LLVM/bin/aarch64-linux-android35-clang++" \
            --target=aarch64-linux-android28 \
            --sysroot="$ANDROID_LLVM/sysroot" \
            -std=c++20 \
            -O3 \
            -c \
            /tmp/funkin_android_test.cpp \
            -o /tmp/funkin_android_test.o

          file /tmp/funkin_android_test.o

      - name: Install native dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            unzip \
            zip \
            pkg-config \
            cmake \
            ninja-build \
            neko \
            libdbus-1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Initialize Haxe environment
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          HAXE_REPO="$(haxelib config)"

          echo "HAXEPATH=$HAXE_REPO" >> "$GITHUB_ENV"
          echo "HAXE_STD_PATH=" >> "$GITHUB_ENV"

          echo "Haxe:"
          haxe --version

          echo "Haxelib:"
          haxelib version

          echo "Haxelib repository:"
          haxelib config

      - name: Verify Haxe standard library
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          cat > /tmp/HaxeTest.hx <<'EOF'
          class HaxeTest {
            static function main() {
              var values:Array<Int> = [1, 2, 3];
              Sys.println(values.length);
            }
          }
          EOF

          haxe \
            -main HaxeTest \
            -cp /tmp \
            --interp

      - name: Configure Haxelib
        run: |
          set -euxo pipefail

          rm -rf .haxelib

          haxelib --never newrepo

      - name: Install HMM
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          haxelib install hmm "$HMM_VERSION" --quiet

          HAXEPATH="$(haxelib config)" \
            haxelib run hmm help

      - name: Install project dependencies
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          HAXEPATH="$(haxelib config)" \
            haxelib run hmm install --force

      - name: Inspect hxcpp and Lime
        run: |
          set -euxo pipefail

          haxelib list

          test -d ".haxelib/hxcpp/git"
          test -d ".haxelib/lime/git"

          git -C ".haxelib/hxcpp/git" rev-parse HEAD || true
          git -C ".haxelib/lime/git" rev-parse HEAD || true

      - name: Inspect hxcpp Android support
        run: |
          set -euxo pipefail

          grep -R \
            "ANDROID_NDK_DIR" \
            ".haxelib/hxcpp/git/tools/hxcpp" \
            | head -30 || true

          grep -R \
            "HXCPP_ANDROID_PLATFORM" \
            ".haxelib/hxcpp/git/tools/hxcpp" \
            | head -30 || true

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          cd ".haxelib/hxcpp/git/tools/hxcpp"

          haxe compile.hxml

      - name: Clean Lime Android
        run: |
          set -euxo pipefail

          rm -rf .haxelib/lime/git/ndll/Android
          rm -rf .haxelib/lime/git/ndll/Android64
          rm -rf .haxelib/lime/git/ndll/Android-arm64
          rm -rf .haxelib/lime/git/ndll/Android64-arm64

      - name: Rebuild Lime C++
        run: |
          set -euxo pipefail

          haxelib run lime rebuild cpp -clean

      - name: Configure Lime Android
        run: |
          set -euxo pipefail

          printf "n\n%s\n%s\n%s\n" \
            "$ANDROID_SDK" \
            "$ANDROID_NDK_DIR" \
            "$JAVA_HOME" \
            | haxelib run lime setup android

      - name: Restore Android environment
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_DIR=$ANDROID_NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_LLVM=$ANDROID_LLVM" >> "$GITHUB_ENV"

          echo "$ANDROID_LLVM/bin" >> "$GITHUB_PATH"

      - name: Rebuild Lime Android
        run: |
          set -euxo pipefail

          haxelib run lime rebuild android -clean

      - name: Verify Lime Android
        run: |
          set -euxo pipefail

          find ".haxelib/lime/git/ndll" \
            -type f \
            \( \
              -name "liblime*.so" \
              -o \
              -name "lime.ndll" \
            \) \
            -print

      - name: Build Android
        run: |
          set -euxo pipefail

          haxelib run lime build android \
            -release \
            -DGITHUB_BUILD

      - name: Find APK
        run: |
          set -euxo pipefail

          find . \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Android
          path: "**/*.apk"


  macos:
    name: macOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update

          brew install \
            pkg-config \
            neko \
            cmake \
            ninja \
            vlc

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Initialize Haxe
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          HAXE_REPO="$(haxelib config)"

          echo "HAXEPATH=$HAXE_REPO" >> "$GITHUB_ENV"
          echo "HAXE_STD_PATH=" >> "$GITHUB_ENV"

          haxe --version
          haxelib version
          haxelib config

      - name: Verify Haxe
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          cat > /tmp/HaxeTest.hx <<'EOF'
          class HaxeTest {
            static function main() {
              Sys.println("Haxe OK");
            }
          }
          EOF

          haxe \
            -main HaxeTest \
            -cp /tmp \
            --interp

      - name: Configure Haxelib
        run: |
          set -euxo pipefail

          rm -rf .haxelib
          haxelib --never newrepo

      - name: Install HMM
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          haxelib install hmm "$HMM_VERSION" --quiet
          HAXEPATH="$(haxelib config)" \
            haxelib run hmm help

      - name: Install dependencies
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          HAXEPATH="$(haxelib config)" \
            haxelib run hmm install --force

      - name: Inspect dependencies
        run: |
          set -euxo pipefail

          haxelib list

          test -d ".haxelib/hxcpp/git"
          test -d ".haxelib/lime/git"

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          cd ".haxelib/hxcpp/git/tools/hxcpp"

          haxe compile.hxml

      - name: Clean Lime
        run: |
          rm -rf .haxelib/lime/git/ndll/Mac
          rm -rf .haxelib/lime/git/ndll/Mac64
          rm -rf .haxelib/lime/git/ndll/MacARM64

      - name: Rebuild Lime macOS
        run: |
          set -euxo pipefail

          haxelib run lime rebuild mac -64 -clean

      - name: Verify Lime macOS
        run: |
          set -euxo pipefail

          find ".haxelib/lime/git/ndll" \
            -type f \
            -name "lime.ndll" \
            -print

          test -f ".haxelib/lime/git/ndll/Mac64/lime.ndll"

      - name: Build macOS
        run: |
          set -euxo pipefail

          haxelib run lime build mac \
            -release \
            -64 \
            -DGITHUB_BUILD

      - name: Package macOS
        run: |
          set -euxo pipefail

          APP="$(find export \
            -type d \
            -name "*.app" \
            | head -1)"

          if [ -z "$APP" ]; then
            echo "macOS application was not generated"
            find export -maxdepth 6 -print
            exit 1
          fi

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "Funkin-Moon-macOS.zip"

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-macOS
          path: Funkin-Moon-macOS.zip


  ios:
    name: iOS
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Initialize Haxe
        run: |
          set -euxo pipefail

          unset HAXE_STD_PATH

          HAXE_REPO="$(haxelib config)"

          echo "HAXEPATH=$HAXE_REPO" >> "$GITHUB_ENV"
