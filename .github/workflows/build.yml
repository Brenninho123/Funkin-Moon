name: Build Funkin-Moon

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HAXE_VERSION: "4.3.7"
  HMM_VERSION: "3.1.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  CXXFLAGS: "-O3 -std=c++20"
  CPPFLAGS: "-O3"
  HAXE_STD_PATH: ""

jobs:

  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            unzip \
            zip \
            pkg-config \
            cmake \
            ninja-build \
            neko \
            libvlc-dev \
            libvlccore-dev \
            libdbus-1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Haxe
        run: |
          haxe --version
          haxelib version
          neko -version

      - name: Configure Haxelib
        run: |
          rm -rf .haxelib
          mkdir -p .haxelib
          haxelib newrepo

      - name: Install HMM
        run: |
          haxelib install hmm --quiet
          haxelib run hmm setup

      - name: Install dependencies
        run: |
          haxelib run hmm install --force

      - name: Prepare hxcpp
        run: |
          HXCPP_PATH=".haxelib/hxcpp/git"

          if [ ! -d "$HXCPP_PATH/tools/hxcpp" ]; then
            echo "hxcpp source directory not found"
            exit 1
          fi

          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Clean Lime native binaries
        run: |
          rm -rf .haxelib/lime/git/ndll/Linux
          rm -rf .haxelib/lime/git/ndll/Linux64

      - name: Rebuild Lime Linux
        run: |
          haxelib run lime rebuild linux -clean

      - name: Verify Lime Linux
        run: |
          find .haxelib/lime/git/ndll -type f -name "lime.ndll" -print
          test -f .haxelib/lime/git/ndll/Linux64/lime.ndll

      - name: Build Linux
        run: |
          haxelib run lime build linux -release -64 -DGITHUB_BUILD

      - name: Package Linux
        run: |
          mkdir -p artifacts/linux

          if [ -d export/linux/bin ]; then
            cp -R export/linux/bin/. artifacts/linux/
          elif [ -d export/linux ]; then
            cp -R export/linux/. artifacts/linux/
          else
            echo "Linux export directory not found"
            find export -maxdepth 4 -type f | head -200
            exit 1
          fi

          cd artifacts
          zip -r ../Funkin-Moon-Linux.zip linux

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Linux
          path: Funkin-Moon-Linux.zip


  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Haxe
        shell: pwsh
        run: |
          haxe --version
          haxelib version

      - name: Configure Haxelib
        shell: pwsh
        run: |
          if (Test-Path ".haxelib") {
            Remove-Item ".haxelib" -Recurse -Force
          }

          New-Item -ItemType Directory -Force ".haxelib" | Out-Null
          haxelib newrepo

      - name: Install HMM
        shell: pwsh
        run: |
          haxelib install hmm --quiet
          haxelib run hmm setup

      - name: Install dependencies
        shell: pwsh
        run: |
          haxelib run hmm install --force

      - name: Prepare hxcpp
        shell: pwsh
        run: |
          $hxcpp = ".haxelib/hxcpp/git/tools/hxcpp"

          if (!(Test-Path $hxcpp)) {
            Write-Error "hxcpp source directory not found"
            exit 1
          }

          Push-Location $hxcpp
          haxe compile.hxml
          Pop-Location

      - name: Clean Lime
        shell: pwsh
        run: |
          Remove-Item ".haxelib/lime/git/ndll/Windows" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item ".haxelib/lime/git/ndll/Windows64" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Rebuild Lime Windows
        shell: pwsh
        run: |
          haxelib run lime rebuild windows -clean

      - name: Verify Lime
        shell: pwsh
        run: |
          Get-ChildItem ".haxelib/lime/git/ndll" -Recurse -Filter "lime.ndll"

          if (!(Test-Path ".haxelib/lime/git/ndll/Windows64/lime.ndll")) {
            Write-Error "Windows lime.ndll was not generated"
            exit 1
          }

      - name: Build Windows
        shell: pwsh
        run: |
          haxelib run lime build windows -release -64 -DGITHUB_BUILD

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifacts" | Out-Null

          if (Test-Path "export/windows/bin") {
            Compress-Archive `
              -Path "export/windows/bin/*" `
              -DestinationPath "Funkin-Moon-Windows.zip" `
              -Force
          } elseif (Test-Path "export/windows") {
            Compress-Archive `
              -Path "export/windows/*" `
              -DestinationPath "Funkin-Moon-Windows.zip" `
              -Force
          } else {
            Write-Error "Windows export directory not found"
            exit 1
          }

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Windows
          path: Funkin-Moon-Windows.zip


  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          yes | sdkmanager --licenses || true

      - name: Configure Android NDK
        run: |
          SDK="${ANDROID_SDK_ROOT}"
          NDK="${SDK}/ndk/${ANDROID_NDK_VERSION}"
          LLVM="${NDK}/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="${LLVM}/bin"

          if [ ! -f "$NDK/source.properties" ]; then
            echo "Android NDK was not installed correctly"
            exit 1
          fi

          if [ ! -d "$LLVM" ]; then
            echo "LLVM toolchain not found"
            find "$NDK/toolchains" -maxdepth 4 -type d | head -100
            exit 1
          fi

          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_DIR=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_LLVM=$LLVM" >> "$GITHUB_ENV"

          echo "$BIN" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK"
          echo "Android NDK: $NDK"
          echo "LLVM: $LLVM"

      - name: Verify Android toolchain
        run: |
          set -euxo pipefail

          command -v aarch64-linux-android35-clang
          command -v aarch64-linux-android35-clang++

          aarch64-linux-android35-clang --version
          aarch64-linux-android35-clang++ --version

      - name: Locate Android C headers
        run: |
          set -euxo pipefail

          echo "Searching for stdlib.h..."
          find "$ANDROID_NDK_DIR" -type f -name "stdlib.h" -print | head -20

          echo "Searching for stdint.h..."
          find "$ANDROID_NDK_DIR" -type f -name "stdint.h" -print | head -20

          echo "Searching for stddef.h..."
          find "$ANDROID_NDK_DIR" -type f -name "stddef.h" -print | head -20

      - name: Create compiler compatibility aliases
        run: |
          set -euxo pipefail

          BIN="$ANDROID_LLVM/bin"

          ln -sf \
            "$BIN/aarch64-linux-android35-clang" \
            "$BIN/aarch64-linux-android-gcc"

          ln -sf \
            "$BIN/aarch64-linux-android35-clang++" \
            "$BIN/aarch64-linux-android-g++"

          ln -sf \
            "$BIN/armv7a-linux-androideabi35-clang" \
            "$BIN/arm-linux-androideabi-gcc"

          ln -sf \
            "$BIN/armv7a-linux-androideabi35-clang++" \
            "$BIN/arm-linux-androideabi-g++"

          command -v aarch64-linux-android-g++
          aarch64-linux-android-g++ --version

      - name: Test Android compiler
        run: |
          set -euxo pipefail

          cat > /tmp/funkin_android_test.cpp <<'EOF'
          #include <stdlib.h>
          #include <stdint.h>
          #include <stddef.h>

          int main() {
            return 0;
          }
          EOF

          aarch64-linux-android35-clang++ \
            --target=aarch64-linux-android28 \
            -std=c++20 \
            -O3 \
            -c \
            /tmp/funkin_android_test.cpp \
            -o /tmp/funkin_android_test.o

          file /tmp/funkin_android_test.o

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            unzip \
            zip \
            pkg-config \
            cmake \
            ninja-build \
            neko \
            libdbus-1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Haxe
        run: |
          haxe --version
          haxelib version

      - name: Configure Haxelib
        run: |
          rm -rf .haxelib
          mkdir -p .haxelib
          haxelib newrepo

      - name: Install HMM
        run: |
          haxelib install hmm --quiet
          haxelib run hmm setup

      - name: Install dependencies
        run: |
          haxelib run hmm install --force

      - name: Verify hxcpp
        run: |
          haxelib list | grep hxcpp || true
          test -d ".haxelib/hxcpp/git"

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          cd ".haxelib/hxcpp/git/tools/hxcpp"
          haxe compile.hxml

      - name: Clean Lime Android binaries
        run: |
          rm -rf .haxelib/lime/git/ndll/Android
          rm -rf .haxelib/lime/git/ndll/Android64
          rm -rf .haxelib/lime/git/ndll/Android-arm64
          rm -rf .haxelib/lime/git/ndll/Android64-arm64

      - name: Rebuild Lime C++
        run: |
          haxelib run lime rebuild cpp -clean

      - name: Setup Lime Android
        run: |
          printf "n\n%s\n%s\n%s\n" \
            "$ANDROID_SDK" \
            "$ANDROID_NDK_DIR" \
            "$JAVA_HOME" \
            | haxelib run lime setup android

      - name: Restore Android environment
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_DIR=$ANDROID_NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_LLVM/bin" >> "$GITHUB_PATH"

      - name: Rebuild Lime Android
        run: |
          set -euxo pipefail

          haxelib run lime rebuild android -clean

      - name: Verify Lime Android
        run: |
          set -euxo pipefail

          find .haxelib/lime/git/ndll -type f \
            \( -name "liblime*.so" -o -name "lime.ndll" \) \
            -print

      - name: Build Android
        run: |
          set -euxo pipefail

          haxelib run lime build android \
            -release \
            -DGITHUB_BUILD

      - name: Find APK
        run: |
          set -euxo pipefail

          find . -type f -name "*.apk" -print

      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Android
          path: |
            **/*.apk


  macos:
    name: macOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update
          brew install pkg-config neko cmake ninja vlc

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Haxe
        run: |
          haxe --version
          haxelib version
          neko -version

      - name: Configure Haxelib
        run: |
          rm -rf .haxelib
          mkdir -p .haxelib
          haxelib newrepo

      - name: Install HMM
        run: |
          haxelib install hmm --quiet
          haxelib run hmm setup

      - name: Install dependencies
        run: |
          haxelib run hmm install --force

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          cd ".haxelib/hxcpp/git/tools/hxcpp"
          haxe compile.hxml

      - name: Clean Lime macOS binaries
        run: |
          rm -rf .haxelib/lime/git/ndll/Mac
          rm -rf .haxelib/lime/git/ndll/Mac64
          rm -rf .haxelib/lime/git/ndll/MacARM64
          rm -rf .haxelib/lime/git/ndll/Mac64-arm64

      - name: Rebuild Lime macOS x64
        run: |
          set -euxo pipefail

          haxelib run lime rebuild mac -64 -clean

      - name: Verify Lime macOS
        run: |
          set -euxo pipefail

          find .haxelib/lime/git/ndll -type f -name "lime.ndll" -print

          if [ ! -f ".haxelib/lime/git/ndll/Mac64/lime.ndll" ]; then
            echo "Mac64 lime.ndll was not generated"
            find .haxelib/lime/git/ndll -maxdepth 3 -type f -print
            exit 1
          fi

      - name: Build macOS
        run: |
          set -euxo pipefail

          haxelib run lime build mac \
            -release \
            -64 \
            -DGITHUB_BUILD

      - name: Package macOS
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          APP=$(find export -type d -name "*.app" | head -1)

          if [ -z "$APP" ]; then
            echo "macOS .app was not generated"
            find export -maxdepth 5 -print
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "Funkin-Moon-macOS.zip"

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-macOS
          path: Funkin-Moon-macOS.zip


  ios:
    name: iOS
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Haxe
        run: |
          haxe --version
          haxelib version

      - name: Configure Haxelib
        run: |
          rm -rf .haxelib
          mkdir -p .haxelib
          haxelib newrepo

      - name: Install HMM
        run: |
          haxelib install hmm --quiet
          haxelib run hmm setup

      - name: Install dependencies
        run: |
          haxelib run hmm install --force

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          cd ".haxelib/hxcpp/git/tools/hxcpp"
          haxe compile.hxml

      - name: Clean Lime iOS binaries
        run: |
          rm -rf .haxelib/lime/git/ndll/iPhone
          rm -rf .haxelib/lime/git/ndll/iPhone64
          rm -rf .haxelib/lime/git/ndll/iPhoneARM64

      - name: Setup Lime iOS
        run: |
          haxelib run lime setup ios || true

      - name: Rebuild Lime iOS
        run: |
          haxelib run lime rebuild ios -clean

      - name: Build iOS
        run: |
          haxelib run lime build ios \
            -release \
            -DGITHUB_BUILD

      - name: Package iOS
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          IPA=$(find . -type f -name "*.ipa" | head -1)

          if [ -n "$IPA" ]; then
            cp "$IPA" artifacts/Funkin-Moon-iOS.ipa
          else
            APP=$(find . -type d -name "*.app" | head -1)

            if [ -z "$APP" ]; then
              echo "No iOS app or IPA was generated"
              exit 1
            fi

            ditto -c -k --sequesterRsrc --keepParent \
              "$APP" \
              artifacts/Funkin-Moon-iOS.app.zip
          fi

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-iOS
          path: artifacts/*
