name: Build Funkin-Moon

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  HAXE_VERSION: "4.3.7"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"

jobs:

  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            git \
            curl \
            wget \
            zip \
            unzip \
            neko \
            libvlc-dev \
            libvlccore-dev \
            libdbus-1-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Haxe
        run: |
          set -euxo pipefail

          echo "Haxe:"
          haxe --version

          echo "Haxelib:"
          haxelib version

          echo "Neko:"
          neko -version

      - name: Install HMM
        run: |
          set -euxo pipefail
          haxelib install hmm --quiet

      - name: Install dependencies
        run: |
          set -euxo pipefail

          rm -rf .haxelib

          haxelib run hmm install

      - name: Show Haxelib dependencies
        run: |
          set -euxo pipefail
          haxelib list

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          HXCPP=".haxelib/hxcpp/git"

          test -d "$HXCPP"
          test -f "$HXCPP/tools/hxcpp/compile.hxml"

          cd "$HXCPP/tools/hxcpp"

          haxe compile.hxml

      - name: Rebuild Lime
        run: |
          set -euxo pipefail

          haxelib run lime rebuild cpp

      - name: Build Linux
        run: |
          set -euxo pipefail

          haxelib run lime build linux \
            -release \
            -64 \
            -DGITHUB_BUILD

      - name: Verify Linux export
        run: |
          set -euxo pipefail

          test -d export

          find export -maxdepth 5 -type f -print

      - name: Package Linux
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          cd export

          zip -r ../artifacts/Funkin-Moon-Linux.zip .

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Linux
          path: artifacts/Funkin-Moon-Linux.zip


  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Haxe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          haxe --version
          haxelib version

      - name: Install HMM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          haxelib install hmm --quiet

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path ".haxelib") {
            Remove-Item ".haxelib" -Recurse -Force
          }

          haxelib run hmm install

      - name: Show Haxelib dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          haxelib list

      - name: Prepare hxcpp
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $HXCPP = ".haxelib/hxcpp/git"

          if (!(Test-Path "$HXCPP/tools/hxcpp/compile.hxml")) {
            throw "hxcpp compile.hxml was not found"
          }

          Set-Location "$HXCPP/tools/hxcpp"

          haxe compile.hxml

      - name: Rebuild Lime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          haxelib run lime rebuild cpp

      - name: Build Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          haxelib run lime build windows `
            -release `
            -64 `
            -DGITHUB_BUILD

      - name: Verify Windows export
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path "export")) {
            throw "Windows export directory was not generated"
          }

          Get-ChildItem export -Recurse

      - name: Package Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force artifacts | Out-Null

          Compress-Archive `
            -Path "export\*" `
            -DestinationPath "artifacts\Funkin-Moon-Windows.zip" `
            -Force

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Windows
          path: artifacts/Funkin-Moon-Windows.zip


  macos:
    name: macOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Homebrew dependencies
        run: |
          set -euxo pipefail

          brew update

          brew install \
            neko \
            pkg-config \
            libvlc \
            cmake

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify environment
        run: |
          set -euxo pipefail

          echo "Architecture:"
          uname -m

          echo "macOS:"
          sw_vers

          echo "Xcode:"
          xcodebuild -version

          echo "Haxe:"
          haxe --version

          echo "Haxelib:"
          haxelib version

          echo "Neko:"
          neko -version

      - name: Install HMM
        run: |
          set -euxo pipefail

          haxelib install hmm --quiet

      - name: Install dependencies
        run: |
          set -euxo pipefail

          rm -rf .haxelib

          haxelib run hmm install

      - name: Show Haxelib dependencies
        run: |
          set -euxo pipefail

          haxelib list

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          HXCPP=".haxelib/hxcpp/git"

          test -d "$HXCPP"
          test -f "$HXCPP/tools/hxcpp/compile.hxml"

          cd "$HXCPP/tools/hxcpp"

          haxe compile.hxml

      - name: Rebuild Lime
        run: |
          set -euxo pipefail

          haxelib run lime rebuild cpp

      - name: Build macOS
        run: |
          set -euxo pipefail

          haxelib run lime build mac \
            -release \
            -64 \
            -DGITHUB_BUILD

      - name: Verify macOS export
        run: |
          set -euxo pipefail

          test -d export

          find export -maxdepth 6 -print

      - name: Package macOS
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          APP=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              APP="$file"
              break
            fi
          done < <(find export -type d -name "*.app" -print 2>/dev/null)

          if [ -n "$APP" ]; then
            cd "$(dirname "$APP")"

            zip -r \
              "$OLDPWD/artifacts/Funkin-Moon-macOS.zip" \
              "$(basename "$APP")"
          else
            cd export

            zip -r \
              ../artifacts/Funkin-Moon-macOS.zip \
              .
          fi

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-macOS
          path: artifacts/Funkin-Moon-macOS.zip


  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Detect Android toolchain
        run: |
          set -euxo pipefail

          SDK="${ANDROID_SDK_ROOT}"
          NDK="${SDK}/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="${TOOLCHAIN}/bin"
          SYSROOT="${TOOLCHAIN}/sysroot"

          test -d "$SDK"
          test -d "$NDK"
          test -d "$TOOLCHAIN"
          test -d "$BIN"
          test -d "$SYSROOT"

          test -f "$NDK/source.properties"
          test -f "$SYSROOT/usr/include/stdlib.h"

          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_DIR=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "ANDROID_SYSROOT=$SYSROOT" >> "$GITHUB_ENV"

          echo "$BIN" >> "$GITHUB_PATH"

      - name: Verify Android headers
        run: |
          set -euxo pipefail

          test -f "$ANDROID_SYSROOT/usr/include/stdlib.h"
          test -f "$ANDROID_SYSROOT/usr/include/stdint.h"
          test -f "$ANDROID_SYSROOT/usr/include/stddef.h"

      - name: Setup Android compilers
        run: |
          set -euxo pipefail

          BIN="$ANDROID_TOOLCHAIN/bin"

          CLANG="$BIN/aarch64-linux-android35-clang"
          CLANGXX="$BIN/aarch64-linux-android35-clang++"

          test -x "$CLANG"
          test -x "$CLANGXX"

          ln -sf "$CLANG" "$BIN/aarch64-linux-android-gcc"
          ln -sf "$CLANGXX" "$BIN/aarch64-linux-android-g++"

          command -v aarch64-linux-android35-clang
          command -v aarch64-linux-android35-clang++

          command -v aarch64-linux-android-gcc
          command -v aarch64-linux-android-g++

      - name: Install native dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            git \
            curl \
            wget \
            zip \
            unzip \
            neko \
            libvlc-dev \
            libvlccore-dev \
            libdbus-1-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Haxe
        run: |
          set -euxo pipefail

          haxe --version
          haxelib version
          neko -version

      - name: Install HMM
        run: |
          set -euxo pipefail

          haxelib install hmm --quiet

      - name: Install dependencies
        run: |
          set -euxo pipefail

          rm -rf .haxelib

          haxelib run hmm install

      - name: Show dependencies
        run: |
          set -euxo pipefail

          haxelib list

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          HXCPP=".haxelib/hxcpp/git"

          test -d "$HXCPP"
          test -f "$HXCPP/tools/hxcpp/compile.hxml"

          cd "$HXCPP/tools/hxcpp"

          haxe compile.hxml

      - name: Rebuild Lime C++
        env:
          CXXFLAGS: "-O3 -std=c++20"
          CFLAGS: "-O3"
        run: |
          set -euxo pipefail

          haxelib run lime rebuild cpp

      - name: Configure Lime Android
        run: |
          set -euxo pipefail

          printf "n\n%s\n%s\n%s\n" \
            "$ANDROID_SDK" \
            "$ANDROID_NDK_DIR" \
            "$JAVA_HOME" \
            | haxelib run lime setup android || true

      - name: Restore Android environment
        run: |
          set -euxo pipefail

          SDK="${ANDROID_SDK_ROOT}"
          NDK="${SDK}/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="${TOOLCHAIN}/bin"
          SYSROOT="${TOOLCHAIN}/sysroot"

          test -d "$NDK"
          test -d "$BIN"
          test -d "$SYSROOT"
          test -f "$SYSROOT/usr/include/stdlib.h"

          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_DIR=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "ANDROID_SYSROOT=$SYSROOT" >> "$GITHUB_ENV"

          echo "$BIN" >> "$GITHUB_PATH"

          ln -sf \
            "$BIN/aarch64-linux-android35-clang" \
            "$BIN/aarch64-linux-android-gcc"

          ln -sf \
            "$BIN/aarch64-linux-android35-clang++" \
            "$BIN/aarch64-linux-android-g++"

      - name: Test Android compiler
        run: |
          set -euxo pipefail

          export PATH="$ANDROID_TOOLCHAIN/bin:$PATH"

          aarch64-linux-android-g++ --version

          printf '#include <stdlib.h>\nint main(){return 0;}\n' \
            > /tmp/test.cpp

          aarch64-linux-android35-clang++ \
            --sysroot="$ANDROID_SYSROOT" \
            -std=c++20 \
            -c /tmp/test.cpp \
            -o /tmp/test.o

          test -f /tmp/test.o

      - name: Rebuild Lime Android
        env:
          CXXFLAGS: "-O3 -std=c++20"
          CFLAGS: "-O3"
        run: |
          set -euxo pipefail

          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_DIR="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"

          export PATH="$ANDROID_TOOLCHAIN/bin:$PATH"

          export CC="aarch64-linux-android35-clang"
          export CXX="aarch64-linux-android35-clang++"

          export CFLAGS="-O3 --sysroot=$ANDROID_SYSROOT"
          export CXXFLAGS="-O3 -std=c++20 --sysroot=$ANDROID_SYSROOT"

          haxelib run lime rebuild android

      - name: Inspect Lime Android configuration
        run: |
          set -euxo pipefail

          echo "Checking for legacy sysroot references"

          if grep -R \
            "prebuilt/platforms/android-28/arch-arm64" \
            .haxelib/lime \
            .haxelib/hxcpp \
            2>/dev/null; then

            echo "Legacy Android sysroot detected"
            exit 1
          fi

          if grep -R \
            "gnu-libstdc++" \
            .haxelib/lime \
            .haxelib/hxcpp \
            2>/dev/null; then

            echo "Legacy GNU STL detected"
            exit 1
          fi

      - name: Build Android
        env:
          CXXFLAGS: "-O3 -std=c++20"
          CFLAGS: "-O3"
        run: |
          set -euxo pipefail

          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_DIR="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"

          export PATH="$ANDROID_TOOLCHAIN/bin:$PATH"

          export CC="aarch64-linux-android35-clang"
          export CXX="aarch64-linux-android35-clang++"

          export CFLAGS="-O3 --sysroot=$ANDROID_SYSROOT"
          export CXXFLAGS="-O3 -std=c++20 --sysroot=$ANDROID_SYSROOT"

          haxelib run lime build android \
            -release \
            -DGITHUB_BUILD

      - name: Find Android APK
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          APK=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              APK="$file"
              break
            fi
          done < <(find export . -type f -name "*.apk" -print 2>/dev/null)

          if [ -z "$APK" ]; then
            echo "APK not found"

            find export \
              -maxdepth 7 \
              -print 2>/dev/null || true

            exit 1
          fi

          cp "$APK" artifacts/Funkin-Moon.apk

      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Android
          path: artifacts/Funkin-Moon.apk


  ios:
    name: iOS
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify environment
        run: |
          set -euxo pipefail

          uname -m
          sw_vers
          xcodebuild -version
          haxe --version
          haxelib version

      - name: Install HMM
        run: |
          set -euxo pipefail

          haxelib install hmm --quiet

      - name: Install dependencies
        run: |
          set -euxo pipefail

          rm -rf .haxelib

          haxelib run hmm install

      - name: Prepare hxcpp
        run: |
          set -euxo pipefail

          HXCPP=".haxelib/hxcpp/git"

          test -f "$HXCPP/tools/hxcpp/compile.hxml"

          cd "$HXCPP/tools/hxcpp"

          haxe compile.hxml

      - name: Rebuild Lime
        run: |
          set -euxo pipefail

          haxelib run lime rebuild cpp

      - name: Setup iOS
        run: |
          set -euxo pipefail

          haxelib run lime setup ios || true

      - name: Build iOS
        run: |
          set -euxo pipefail

          haxelib run lime build ios \
            -release \
            -DGITHUB_BUILD

      - name: Package iOS
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          IPA=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              IPA="$file"
              break
            fi
          done < <(find export . -type f -name "*.ipa" -print 2>/dev/null)

          if [ -n "$IPA" ]; then
            cp "$IPA" artifacts/Funkin-Moon-iOS.ipa
          else
            APP=""

            while IFS= read -r file; do
              if [ -n "$file" ]; then
                APP="$file"
                break
              fi
            done < <(find export . -type d -name "*.app" -print 2>/dev/null)

            if [ -z "$APP" ]; then
              echo "iOS application was not generated"
              find export -maxdepth 7 -print 2>/dev/null || true
              exit 1
            fi

            cd "$(dirname "$APP")"

            zip -r \
              "$OLDPWD/artifacts/Funkin-Moon-iOS.app.zip" \
              "$(basename "$APP")"
          fi

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-iOS
          path: artifacts/*
