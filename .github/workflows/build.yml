name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  HAXE_VERSION: 4.3.7

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            curl \
            libdbus-1-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install HMM
        run: |
          haxelib install hmm --quiet
          haxelib run hmm --help > /dev/null

      - name: Install Haxe dependencies
        run: |
          rm -rf .haxelib
          haxelib run hmm install

      - name: Build hxcpp
        run: |
          haxelib run hxcpp build

      - name: Rebuild Lime
        run: |
          haxelib run lime rebuild cpp

      - name: Build Linux
        env:
          CXXFLAGS: -O3 -std=c++20
          CFLAGS: -O3
        run: |
          haxelib run lime build linux -release -64 -DGITHUB_BUILD

      - name: Package
        run: |
          cd export/release/linux/bin
          zip -9 -r ../../../../Funkin-Moon-Linux.zip .

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Linux
          path: Funkin-Moon-Linux.zip
          compression-level: 0

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install HMM
        shell: pwsh
        run: |
          haxelib install hmm --quiet
          haxelib run hmm --help | Out-Null

      - name: Install Haxe dependencies
        shell: pwsh
        run: |
          if (Test-Path ".haxelib") {
            Remove-Item ".haxelib" -Recurse -Force
          }
          haxelib run hmm install

      - name: Build hxcpp
        shell: pwsh
        run: |
          haxelib run hxcpp build

      - name: Rebuild Lime
        shell: pwsh
        run: |
          haxelib run lime rebuild cpp

      - name: Build Windows
        shell: pwsh
        env:
          CXXFLAGS: -O3 -std=c++20
          CFLAGS: -O3
        run: |
          haxelib run lime build windows -release -64 -DGITHUB_BUILD

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "export/release/windows/bin/*" `
            -DestinationPath "Funkin-Moon-Windows.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Windows
          path: Funkin-Moon-Windows.zip
          compression-level: 0

  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            curl \
            libdbus-1-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Configure Android
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install HMM
        run: |
          haxelib install hmm --quiet
          haxelib run hmm --help > /dev/null

      - name: Install Haxe dependencies
        run: |
          rm -rf .haxelib
          haxelib run hmm install

      - name: Build hxcpp
        run: |
          haxelib run hxcpp build

      - name: Rebuild Lime C++
        env:
          CXXFLAGS: -O3 -std=c++20
          CFLAGS: -O3
        run: |
          haxelib run lime rebuild cpp

      - name: Setup Lime Android
        run: |
          printf "n\n%s\n%s\n%s\n" \
            "$ANDROID_SDK_ROOT" \
            "$ANDROID_NDK_ROOT" \
            "$JAVA_HOME" | haxelib run lime setup android

      - name: Rebuild Lime Android
        env:
          CXXFLAGS: -O3 -std=c++20
          CFLAGS: -O3
        run: |
          haxelib run lime rebuild android

      - name: Build Android
        env:
          CXXFLAGS: -O3 -std=c++20
          CFLAGS: -O3
        run: |
          haxelib run lime build android -release -DGITHUB_BUILD

      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Android
          path: export/release/android/**/*.apk
          compression-level: 0
