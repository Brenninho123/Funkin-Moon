name: Build Funkin-Moon

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  HAXE_VERSION: "4.3.7"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"

jobs:

  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            git \
            curl \
            wget \
            zip \
            unzip \
            neko \
            libvlc-dev \
            libvlccore-dev \
            libdbus-1-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Haxe
        run: |
          set -e
          haxe --version
          haxelib version
          neko -version

      - name: Install HMM
        run: |
          set -e
          haxelib install hmm --quiet

      - name: Reset Haxelib
        run: |
          set -e
          rm -rf .haxelib
          haxelib run hmm install

      - name: Prepare hxcpp
        run: |
          set -e

          HXCPP_PATH=".haxelib/hxcpp/git"

          test -f "$HXCPP_PATH/tools/hxcpp/compile.hxml"

          cd "$HXCPP_PATH/tools/hxcpp"

          haxe compile.hxml

      - name: Rebuild Lime
        run: |
          set -e
          haxelib run lime rebuild cpp

      - name: Build Linux
        run: |
          set -e
          haxelib run lime build linux -release -64 -DGITHUB_BUILD

      - name: Package Linux
        run: |
          set -e

          mkdir -p artifacts

          if [ ! -d "export" ]; then
            echo "Linux export directory was not generated"
            exit 1
          fi

          cd export
          zip -r ../artifacts/Funkin-Moon-Linux.zip .

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Linux
          path: artifacts/Funkin-Moon-Linux.zip


  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Haxe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          haxe --version
          haxelib version

      - name: Install HMM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          haxelib install hmm --quiet

      - name: Reset Haxelib
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path ".haxelib") {
            Remove-Item ".haxelib" -Recurse -Force
          }

          haxelib run hmm install

      - name: Prepare hxcpp
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $hxcpp = ".haxelib/hxcpp/git/tools/hxcpp"

          if (!(Test-Path "$hxcpp/compile.hxml")) {
            throw "hxcpp compile.hxml was not found"
          }

          Set-Location $hxcpp

          haxe compile.hxml

      - name: Rebuild Lime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          haxelib run lime rebuild cpp

      - name: Build Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          haxelib run lime build windows -release -64 -DGITHUB_BUILD

      - name: Package Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force artifacts | Out-Null

          if (!(Test-Path "export")) {
            throw "Windows export directory was not generated"
          }

          Compress-Archive \
            -Path "export\*" \
            -DestinationPath "artifacts\Funkin-Moon-Windows.zip" \
            -Force

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Windows
          path: artifacts/Funkin-Moon-Windows.zip


  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Configure Android toolchain
        run: |
          set -e

          SDK="${ANDROID_SDK_ROOT}"
          NDK="${SDK}/ndk/${ANDROID_NDK_VERSION}"
          HOST="linux-x86_64"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/${HOST}"
          BIN="${TOOLCHAIN}/bin"
          SYSROOT="${TOOLCHAIN}/sysroot"

          test -d "$SDK"
          test -d "$NDK"
          test -d "$TOOLCHAIN"
          test -d "$BIN"
          test -d "$SYSROOT"

          test -f "$NDK/source.properties"
          test -f "$SYSROOT/usr/include/stdlib.h"

          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_DIR=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "ANDROID_SYSROOT=$SYSROOT" >> "$GITHUB_ENV"

          echo "$BIN" >> "$GITHUB_PATH"

          echo "SDK=$SDK"
          echo "NDK=$NDK"
          echo "TOOLCHAIN=$TOOLCHAIN"
          echo "SYSROOT=$SYSROOT"

      - name: Validate Android headers
        run: |
          set -e

          test -f "$ANDROID_SYSROOT/usr/include/stdlib.h"
          test -f "$ANDROID_SYSROOT/usr/include/stdint.h"
          test -f "$ANDROID_SYSROOT/usr/include/stddef.h"

          echo "Android C headers:"
          printf '%s\n' \
            "$ANDROID_SYSROOT/usr/include/stdlib.h" \
            "$ANDROID_SYSROOT/usr/include/stdint.h" \
            "$ANDROID_SYSROOT/usr/include/stddef.h"

      - name: Create compiler compatibility layer
        run: |
          set -e

          BIN="$ANDROID_TOOLCHAIN/bin"

          CLANG="$BIN/aarch64-linux-android35-clang"
          CLANGXX="$BIN/aarch64-linux-android35-clang++"

          test -x "$CLANG"
          test -x "$CLANGXX"

          ln -sf "$CLANG" "$BIN/aarch64-linux-android-gcc"
          ln -sf "$CLANGXX" "$BIN/aarch64-linux-android-g++"

          ln -sf "$CLANG" "$BIN/aarch64-linux-android-gcc-35"
          ln -sf "$CLANGXX" "$BIN/aarch64-linux-android-g++-35"

          command -v aarch64-linux-android-gcc
          command -v aarch64-linux-android-g++

          aarch64-linux-android-g++ --version

      - name: Install native dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            git \
            curl \
            wget \
            zip \
            unzip \
            neko \
            libvlc-dev \
            libvlccore-dev \
            libdbus-1-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Haxe
        run: |
          set -e

          haxe --version
          haxelib version
          neko -version

      - name: Install HMM
        run: |
          set -e

          haxelib install hmm --quiet

      - name: Reset Haxelib
        run: |
          set -e

          rm -rf .haxelib

          haxelib run hmm install

      - name: Validate hxcpp
        run: |
          set -e

          HXCPP_PATH=".haxelib/hxcpp/git"

          test -d "$HXCPP_PATH"
          test -f "$HXCPP_PATH/tools/hxcpp/compile.hxml"

          echo "hxcpp path:"
          realpath "$HXCPP_PATH"

      - name: Prepare hxcpp
        run: |
          set -e

          HXCPP_PATH=".haxelib/hxcpp/git"

          cd "$HXCPP_PATH/tools/hxcpp"

          haxe compile.hxml

      - name: Clean old Android native configuration
        run: |
          set -e

          rm -rf "$HOME/.lime"
          rm -rf "$HOME/.haxelib/lime"

          find .haxelib/lime -type f \
            \( -name "*.xml" -o -name "*.hxml" -o -name "*.hx" -o -name "*.hxcpp" \) \
            -print 2>/dev/null \
            | while IFS= read -r file; do
                if grep -q "gnu-libstdc++\|prebuilt/platforms/android-28/arch-arm64" "$file" 2>/dev/null; then
                  echo "Legacy Android configuration found in $file"
                fi
              done || true

      - name: Rebuild Lime C++
        env:
          CXXFLAGS: "-O3 -std=c++20"
          CFLAGS: "-O3"
        run: |
          set -e

          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_DIR="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"

          haxelib run lime rebuild cpp

      - name: Configure Lime Android
        run: |
          set -e

          printf "n\n%s\n%s\n%s\n" \
            "$ANDROID_SDK" \
            "$ANDROID_NDK_DIR" \
            "$JAVA_HOME" \
            | haxelib run lime setup android || true

      - name: Force Android environment
        run: |
          set -e

          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_DIR="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"

          echo "ANDROID_SDK=$ANDROID_SDK"
          echo "ANDROID_NDK_DIR=$ANDROID_NDK_DIR"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

          test -d "$ANDROID_NDK_DIR"
          test -f "$ANDROID_NDK_DIR/source.properties"

          test -d "$ANDROID_TOOLCHAIN"
          test -d "$ANDROID_SYSROOT"

          test -f "$ANDROID_SYSROOT/usr/include/stdlib.h"

      - name: Rebuild Lime Android
        env:
          CXXFLAGS: "-O3 -std=c++20"
          CFLAGS: "-O3"
          ANDROID_STL: "c++_static"
        run: |
          set -e

          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_DIR="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"

          export PATH="$ANDROID_TOOLCHAIN/bin:$PATH"

          export CXX="aarch64-linux-android35-clang++"
          export CC="aarch64-linux-android35-clang"

          export CXXFLAGS="-O3 -std=c++20 --sysroot=$ANDROID_SYSROOT"
          export CFLAGS="-O3 --sysroot=$ANDROID_SYSROOT"

          aarch64-linux-android35-clang \
            --sysroot="$ANDROID_SYSROOT" \
            -E -x c /dev/null \
            -o /dev/null

          haxelib run lime rebuild android

      - name: Verify generated Android flags
        run: |
          set -e

          if grep -R \
            "prebuilt/platforms/android-28/arch-arm64\|gnu-libstdc++" \
            .haxelib/lime \
            .haxelib/hxcpp \
            2>/dev/null; then

            echo "Legacy Android STL/sysroot configuration detected"

            exit 1
          fi

          echo "No legacy GNU STL configuration detected"

      - name: Build Android
        env:
          CXXFLAGS: "-O3 -std=c++20"
          CFLAGS: "-O3"
          ANDROID_STL: "c++_static"
        run: |
          set -e

          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_DIR="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"

          export PATH="$ANDROID_TOOLCHAIN/bin:$PATH"

          export CXX="aarch64-linux-android35-clang++"
          export CC="aarch64-linux-android35-clang"

          export CXXFLAGS="-O3 -std=c++20 --sysroot=$ANDROID_SYSROOT"
          export CFLAGS="-O3 --sysroot=$ANDROID_SYSROOT"

          haxelib run lime build android \
            -release \
            -DGITHUB_BUILD

      - name: Find APK
        run: |
          set -e

          mkdir -p artifacts

          APK=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              APK="$file"
              break
            fi
          done < <(find export . -type f -name "*.apk" -print 2>/dev/null)

          if [ -z "$APK" ]; then
            echo "APK was not generated"

            find export \
              -maxdepth 6 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "APK=$APK"

          cp "$APK" artifacts/Funkin-Moon.apk

      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Android
          path: artifacts/Funkin-Moon.apk


  ios:
    name: iOS
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify environment
        run: |
          set -e

          haxe --version
          haxelib version
          xcodebuild -version

      - name: Install HMM
        run: |
          set -e
          haxelib install hmm --quiet

      - name: Reset Haxelib
        run: |
          set -e

          rm -rf .haxelib

          haxelib run hmm install

      - name: Prepare hxcpp
        run: |
          set -e

          HXCPP_PATH=".haxelib/hxcpp/git"

          test -f "$HXCPP_PATH/tools/hxcpp/compile.hxml"

          cd "$HXCPP_PATH/tools/hxcpp"

          haxe compile.hxml

      - name: Rebuild Lime
        run: |
          set -e

          haxelib run lime rebuild cpp

      - name: Setup iOS
        run: |
          set -e

          haxelib run lime setup ios || true

      - name: Build iOS
        run: |
          set -e

          haxelib run lime build ios \
            -release \
            -DGITHUB_BUILD

      - name: Package iOS
        run: |
          set -e

          mkdir -p artifacts

          IPA=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              IPA="$file"
              break
            fi
          done < <(find export . -type f -name "*.ipa" -print 2>/dev/null)

          if [ -n "$IPA" ]; then
            cp "$IPA" artifacts/Funkin-Moon-iOS.ipa
          else
            APP=""

            while IFS= read -r file; do
              if [ -n "$file" ]; then
                APP="$file"
                break
              fi
            done < <(find export . -type d -name "*.app" -print 2>/dev/null)

            if [ -z "$APP" ]; then
              echo "No iOS application was generated"
              exit 1
            fi

            cd "$(dirname "$APP")"

            zip -r \
              "$OLDPWD/artifacts/Funkin-Moon-iOS.app.zip" \
              "$(basename "$APP")"
          fi

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-iOS
          path: artifacts/*
