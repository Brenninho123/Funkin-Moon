name: Funkin-Moon Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funkin-moon-${{ github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: 4.3.7
  CXXFLAGS: -O3 -std=c++20
  CFLAGS: -O3

jobs:

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            curl \
            zip \
            unzip \
            neko \
            libdbus-1-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify toolchain
        run: |
          haxe --version
          haxelib version
          neko -version
          gcc --version
          g++ --version
          uname -m

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install Haxe dependencies
        run: |
          rm -rf .haxelib
          haxelib run hmm install

      - name: Prepare hxcpp
        run: |
          HXCPP_PATH=".haxelib/hxcpp/git"

          if [ ! -d "$HXCPP_PATH" ]; then
            echo "hxcpp source directory was not found."
            exit 1
          fi

          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Build hxcpp
        run: |
          haxelib run hxcpp build

      - name: Rebuild Lime
        run: |
          haxelib run lime rebuild cpp

      - name: Verify Lime
        run: |
          haxelib run lime version
          find .haxelib -type f \( -name "lime.ndll" -o -name "lime*.ndll" \) -print

      - name: Build Linux
        run: |
          haxelib run lime build linux -release -64 -DGITHUB_BUILD

      - name: Verify output
        run: |
          test -d export/release/linux/bin
          find export/release/linux/bin -maxdepth 2 -type f -print

      - name: Package
        run: |
          cd export/release/linux/bin
          zip -9 -r ../../../../Funkin-Moon-Linux-x64.zip .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Linux-x64
          path: Funkin-Moon-Linux-x64.zip
          if-no-files-found: error
          compression-level: 0


  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify toolchain
        shell: pwsh
        run: |
          haxe --version
          haxelib version
          gcc --version
          g++ --version

      - name: Install HMM
        shell: pwsh
        run: |
          haxelib install hmm

      - name: Install Haxe dependencies
        shell: pwsh
        run: |
          if (Test-Path ".haxelib") {
            Remove-Item ".haxelib" -Recurse -Force
          }

          haxelib run hmm install

      - name: Prepare hxcpp
        shell: pwsh
        run: |
          $HXCPP_PATH = ".haxelib/hxcpp/git"

          if (!(Test-Path $HXCPP_PATH)) {
            throw "hxcpp source directory was not found."
          }

          Set-Location "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Build hxcpp
        shell: pwsh
        run: |
          haxelib run hxcpp build

      - name: Rebuild Lime
        shell: pwsh
        run: |
          haxelib run lime rebuild cpp

      - name: Verify Lime
        shell: pwsh
        run: |
          haxelib run lime version
          Get-ChildItem -Path .haxelib -Recurse -Filter "lime*.ndll" -ErrorAction SilentlyContinue

      - name: Build Windows
        shell: pwsh
        run: |
          haxelib run lime build windows -release -64 -DGITHUB_BUILD

      - name: Verify output
        shell: pwsh
        run: |
          if (!(Test-Path "export/release/windows/bin")) {
            throw "Windows build output was not generated."
          }

          Get-ChildItem "export/release/windows/bin" -Recurse

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "export/release/windows/bin/*" `
            -DestinationPath "Funkin-Moon-Windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Windows-x64
          path: Funkin-Moon-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0


  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;27.2.12479018"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            curl \
            zip \
            unzip \
            neko \
            libdbus-1-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Configure Android
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          haxe --version
          haxelib version
          java -version
          adb version
          "$ANDROID_NDK_ROOT/ndk-build" --version

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install Haxe dependencies
        run: |
          rm -rf .haxelib
          haxelib run hmm install

      - name: Prepare hxcpp
        run: |
          HXCPP_PATH=".haxelib/hxcpp/git"

          if [ ! -d "$HXCPP_PATH" ]; then
            echo "hxcpp source directory was not found."
            exit 1
          fi

          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Build hxcpp
        run: |
          haxelib run hxcpp build

      - name: Rebuild Lime C++
        run: |
          haxelib run lime rebuild cpp

      - name: Setup Lime Android
        run: |
          printf "n\n%s\n%s\n%s\n" \
            "$ANDROID_SDK_ROOT" \
            "$ANDROID_NDK_ROOT" \
            "$JAVA_HOME" | haxelib run lime setup android

      - name: Rebuild Lime Android
        run: |
          haxelib run lime rebuild android

      - name: Build Android
        run: |
          haxelib run lime build android -release -DGITHUB_BUILD

      - name: Verify APK
        run: |
          find export -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Android
          path: export/release/android/**/*.apk
          if-no-files-found: error
          compression-level: 0


  ios:
    name: iOS x64
    runs-on: macos-15-intel
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify toolchain
        run: |
          haxe --version
          haxelib version
          xcodebuild -version
          xcode-select -p
          uname -m

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install Haxe dependencies
        run: |
          rm -rf .haxelib
          haxelib run hmm install

      - name: Prepare hxcpp
        run: |
          HXCPP_PATH=".haxelib/hxcpp/git"

          if [ ! -d "$HXCPP_PATH" ]; then
            echo "hxcpp source directory was not found."
            exit 1
          fi

          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Build hxcpp
        run: |
          haxelib run hxcpp build

      - name: Rebuild Lime
        run: |
          haxelib run lime rebuild cpp

      - name: Setup Lime iOS
        run: |
          haxelib run lime setup ios

      - name: Build iOS
        run: |
          haxelib run lime build ios -release -DGITHUB_BUILD

      - name: Verify iOS output
        run: |
          find export -type f -name "*.ipa" -print
          find export -type d -name "*.app" -print

      - name: Package iOS
        run: |
          rm -rf ios-package
          mkdir -p ios-package

          IPA=$(find export -type f -name "*.ipa" | head -n 1)

          if [ -n "$IPA" ]; then
            cp "$IPA" ios-package/
          else
            APP=$(find export -type d -name "*.app" | head -n 1)

            if [ -z "$APP" ]; then
              echo "No iOS application was generated."
              exit 1
            fi

            cp -R "$APP" ios-package/
          fi

          cd ios-package
          zip -9 -r ../Funkin-Moon-iOS.zip .

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-iOS
          path: Funkin-Moon-iOS.zip
          if-no-files-found: error
          compression-level: 0
