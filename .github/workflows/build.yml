name: Funkin-Moon Build

on: push

jobs:
android:
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - uses: krdlab/setup-haxe@v2
    with:
      haxe-version: 4.3.7

  - name: Install Dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y libvlc-dev libvlccore-dev
      haxelib install hmm
      echo "HAXEPATH=$(haxelib config)" >> "$GITHUB_ENV"
      haxelib --global run hmm install

  - name: Build Android
    run: |
      haxelib --always run lime setup
      haxelib run lime build android -release

  - name: Upload Android
    uses: actions/upload-artifact@v4
    with:
      name: Funkin-Moon-Android
      path: export/android/**/*.apk

windows:
runs-on: windows-latest

steps:
  - uses: actions/checkout@v4

  - uses: krdlab/setup-haxe@v2
    with:
      haxe-version: 4.3.7

  - name: Install Dependencies
    shell: pwsh
    run: |
      haxelib install hmm
      "HAXEPATH=$(haxelib config)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      haxelib --global run hmm install

  - name: Build Windows
    shell: pwsh
    run: |
      haxelib --always run lime setup
      haxelib run lime build windows -release

  - name: Upload Windows
    uses: actions/upload-artifact@v4
    with:
      name: Funkin-Moon-Windows
      path: export/windows/**
