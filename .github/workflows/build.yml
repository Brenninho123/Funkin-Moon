name: Funkin-Moon Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funkin-moon-${{ github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: 4.3.7
  BUILD_TYPE: release
  CXXFLAGS: -O3 -std=c++20
  CFLAGS: -O3

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            curl \
            zip \
            unzip \
            libdbus-1-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify toolchain
        run: |
          haxe --version
          haxelib version
          gcc --version
          g++ --version

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install Haxe dependencies
        run: |
          rm -rf .haxelib
          haxelib run hmm install

      - name: Build hxcpp
        run: |
          haxelib run hxcpp build

      - name: Rebuild Lime
        run: |
          haxelib run lime rebuild cpp

      - name: Verify Lime
        run: |
          haxelib run lime version
          find .haxelib -name "lime.ndll" -o -name "lime*.ndll" | head -20

      - name: Build Linux
        run: |
          haxelib run lime build linux -release -64 -DGITHUB_BUILD

      - name: Package
        run: |
          cd export/release/linux/bin
          zip -9 -r ../../../../Funkin-Moon-Linux-x64.zip .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Linux-x64
          path: Funkin-Moon-Linux-x64.zip
          compression-level: 0

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify toolchain
        shell: pwsh
        run: |
          haxe --version
          haxelib version

      - name: Install HMM
        shell: pwsh
        run: |
          haxelib install hmm

      - name: Install Haxe dependencies
        shell: pwsh
        run: |
          if (Test-Path ".haxelib") {
            Remove-Item ".haxelib" -Recurse -Force
          }
          haxelib run hmm install

      - name: Build hxcpp
        shell: pwsh
        run: |
          haxelib run hxcpp build

      - name: Rebuild Lime
        shell: pwsh
        run: |
          haxelib run lime rebuild cpp

      - name: Verify Lime
        shell: pwsh
        run: |
          haxelib run lime version
          Get-ChildItem -Path .haxelib -Recurse -Filter "lime*.ndll" -ErrorAction SilentlyContinue

      - name: Build Windows
        shell: pwsh
        run: |
          haxelib run lime build windows -release -64 -DGITHUB_BUILD

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "export/release/windows/bin/*" `
            -DestinationPath "Funkin-Moon-Windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Windows-x64
          path: Funkin-Moon-Windows-x64.zip
          compression-level: 0

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;27.2.12479018"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            curl \
            zip \
            unzip \
            libdbus-1-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Configure Android
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Verify Android
        run: |
          haxe --version
          haxelib version
          java -version
          adb version
          "$ANDROID_NDK_ROOT/ndk-build" --version

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install Haxe dependencies
        run: |
          rm -rf .haxelib
          haxelib run hmm install

      - name: Build hxcpp
        run: |
          haxelib run hxcpp build

      - name: Rebuild Lime C++
        run: |
          haxelib run lime rebuild cpp

      - name: Setup Lime Android
        run: |
          printf "n\n%s\n%s\n%s\n" \
            "$ANDROID_SDK_ROOT" \
            "$ANDROID_NDK_ROOT" \
            "$JAVA_HOME" | haxelib run lime setup android

      - name: Rebuild Lime Android
        run: |
          haxelib run lime rebuild android

      - name: Build Android
        run: |
          haxelib run lime build android -release -DGITHUB_BUILD

      - name: Find APK
        run: |
          find export -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Android
          path: export/release/android/**/*.apk
          if-no-files-found: error
          compression-level: 0

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify toolchain
        run: |
          haxe --version
          haxelib version
          xcodebuild -version
          xcode-select -p

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install Haxe dependencies
        run: |
          rm -rf .haxelib
          haxelib run hmm install

      - name: Build hxcpp
        run: |
          haxelib run hxcpp build

      - name: Rebuild Lime
        run: |
          haxelib run lime rebuild cpp

      - name: Setup Lime iOS
        run: |
          haxelib run lime setup ios

      - name: Build iOS
        run: |
          haxelib run lime build ios -release -DGITHUB_BUILD

      - name: Find iOS output
        run: |
          find export -maxdepth 6 -type f \( -name "*.ipa" -o -name "*.app" \) -print

      - name: Package iOS
        run: |
          mkdir -p ios-package

          if find export -type f -name "*.ipa" | grep -q .; then
            find export -type f -name "*.ipa" -exec cp {} ios-package/ \;
          else
            find export -type d -name "*.app" -exec cp -R {} ios-package/ \;
          fi

          cd ios-package
          zip -9 -r ../Funkin-Moon-iOS.zip .

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-iOS
          path: Funkin-Moon-iOS.zip
          compression-level: 0
