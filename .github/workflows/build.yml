name: Build Funkin-Moon

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  HAXE_VERSION: "4.3.7"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"

jobs:

  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            git \
            curl \
            wget \
            zip \
            unzip \
            neko \
            libvlc-dev \
            libvlccore-dev \
            libdbus-1-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Haxe
        run: |
          set -e
          haxe --version
          haxelib version
          neko -version

      - name: Install HMM
        run: |
          set -e
          haxelib install hmm --quiet

      - name: Reset Haxelib
        run: |
          set -e
          rm -rf .haxelib
          haxelib run hmm install

      - name: Prepare hxcpp
        run: |
          set -e
          HXCPP_PATH=".haxelib/hxcpp/git"

          if [ ! -f "$HXCPP_PATH/tools/hxcpp/compile.hxml" ]; then
            echo "hxcpp compile.hxml was not found"
            exit 1
          fi

          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Rebuild Lime
        run: |
          set -e
          haxelib run lime rebuild cpp

      - name: Build Linux
        env:
          HAXEFLAGS: "-D GITHUB_BUILD"
        run: |
          set -e
          haxelib run lime build linux -release -64 -DGITHUB_BUILD

      - name: Package Linux
        run: |
          set -e
          mkdir -p artifacts/linux
          find export -type f -exec cp --parents {} artifacts/linux/ \; || true
          cd artifacts
          zip -r ../Funkin-Moon-Linux.zip linux

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Linux
          path: Funkin-Moon-Linux.zip


  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Haxe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          haxe --version
          haxelib version

      - name: Install HMM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          haxelib install hmm --quiet

      - name: Reset Haxelib
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path ".haxelib") {
            Remove-Item ".haxelib" -Recurse -Force
          }

          haxelib run hmm install

      - name: Prepare hxcpp
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $hxcpp = ".haxelib/hxcpp/git/tools/hxcpp"

          if (!(Test-Path "$hxcpp/compile.hxml")) {
            Write-Error "hxcpp compile.hxml was not found"
          }

          Set-Location $hxcpp
          haxe compile.hxml

      - name: Rebuild Lime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          haxelib run lime rebuild cpp

      - name: Build Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          haxelib run lime build windows -release -64 -DGITHUB_BUILD

      - name: Package Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force artifacts | Out-Null

          if (Test-Path "export") {
            Compress-Archive -Path "export\*" -DestinationPath "artifacts\Funkin-Moon-Windows.zip" -Force
          } else {
            Write-Error "Windows export directory was not generated"
          }

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Windows
          path: artifacts/Funkin-Moon-Windows.zip


  android:
    name: Android
    runs-on: ubuntu-latest

    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17/x64
      ANDROID_PLATFORM: android-35
      ANDROID_BUILD_TOOLS: 35.0.0
      ANDROID_NDK_VERSION: 27.2.12479018

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Configure Android environment
        run: |
          set -e

          SDK="${ANDROID_SDK_ROOT}"
          NDK="${SDK}/ndk/${ANDROID_NDK_VERSION}"
          LLVM="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          if [ ! -d "$SDK" ]; then
            echo "Android SDK does not exist: $SDK"
            exit 1
          fi

          if [ ! -d "$NDK" ]; then
            echo "Android NDK does not exist: $NDK"
            exit 1
          fi

          if [ ! -f "$NDK/source.properties" ]; then
            echo "Invalid Android NDK installation"
            exit 1
          fi

          if [ ! -d "$LLVM" ]; then
            echo "LLVM directory does not exist: $LLVM"
            exit 1
          fi

          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_DIR=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "$LLVM" >> "$GITHUB_PATH"

      - name: Create Android compiler compatibility aliases
        run: |
          set -e

          LLVM="$ANDROID_NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"

          if [ ! -f "$LLVM/aarch64-linux-android35-clang" ]; then
            echo "ARM64 clang compiler not found"
            exit 1
          fi

          if [ ! -f "$LLVM/aarch64-linux-android35-clang++" ]; then
            echo "ARM64 clang++ compiler not found"
            exit 1
          fi

          ln -sf \
            "$LLVM/aarch64-linux-android35-clang" \
            "$LLVM/aarch64-linux-android-gcc"

          ln -sf \
            "$LLVM/aarch64-linux-android35-clang++" \
            "$LLVM/aarch64-linux-android-g++"

          ln -sf \
            "$LLVM/aarch64-linux-android35-clang" \
            "$LLVM/aarch64-linux-android-gcc-35"

          ln -sf \
            "$LLVM/aarch64-linux-android35-clang++" \
            "$LLVM/aarch64-linux-android-g++-35"

          echo "Android compiler aliases created"

      - name: Verify Android toolchain
        run: |
          set -e

          echo "ANDROID_SDK=$ANDROID_SDK"
          echo "ANDROID_NDK_DIR=$ANDROID_NDK_DIR"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

          command -v aarch64-linux-android35-clang
          command -v aarch64-linux-android35-clang++

          command -v aarch64-linux-android-gcc
          command -v aarch64-linux-android-g++

          aarch64-linux-android35-clang --version
          aarch64-linux-android35-clang++ --version
          aarch64-linux-android-gcc --version
          aarch64-linux-android-g++ --version

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            git \
            curl \
            wget \
            zip \
            unzip \
            neko \
            libvlc-dev \
            libvlccore-dev \
            libdbus-1-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Haxe
        run: |
          set -e
          haxe --version
          haxelib version
          neko -version

      - name: Install HMM
        run: |
          set -e
          haxelib install hmm --quiet

      - name: Reset Haxelib
        run: |
          set -e
          rm -rf .haxelib
          haxelib run hmm install

      - name: Prepare hxcpp
        run: |
          set -e

          HXCPP_PATH=".haxelib/hxcpp/git"

          if [ ! -f "$HXCPP_PATH/tools/hxcpp/compile.hxml" ]; then
            echo "hxcpp compile.hxml was not found"
            exit 1
          fi

          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Rebuild Lime C++
        env:
          CXXFLAGS: "-O3 -std=c++20"
        run: |
          set -e

          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_DIR="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"

          haxelib run lime rebuild cpp

      - name: Configure Lime Android
        run: |
          set -e

          SDK="$ANDROID_SDK_ROOT"
          NDK="$ANDROID_NDK_DIR"

          printf "n\n%s\n%s\n%s\n" \
            "$SDK" \
            "$NDK" \
            "$JAVA_HOME" \
            | haxelib run lime setup android || true

      - name: Re-export Android environment
        run: |
          set -e

          SDK="${ANDROID_SDK_ROOT}"
          NDK="${SDK}/ndk/${ANDROID_NDK_VERSION}"
          LLVM="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          if [ ! -d "$NDK" ]; then
            echo "NDK disappeared after Lime setup"
            exit 1
          fi

          if [ ! -d "$LLVM" ]; then
            echo "LLVM directory disappeared after Lime setup"
            exit 1
          fi

          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_DIR=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "$LLVM" >> "$GITHUB_PATH"

          ln -sf \
            "$LLVM/aarch64-linux-android35-clang" \
            "$LLVM/aarch64-linux-android-gcc"

          ln -sf \
            "$LLVM/aarch64-linux-android35-clang++" \
            "$LLVM/aarch64-linux-android-g++"

      - name: Rebuild Lime Android
        env:
          CXXFLAGS: "-O3 -std=c++20"
        run: |
          set -e

          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_DIR="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"

          LLVM="$ANDROID_NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$LLVM:$PATH"

          test -d "$ANDROID_NDK_DIR"
          test -f "$ANDROID_NDK_DIR/source.properties"
          test -x "$LLVM/aarch64-linux-android35-clang"
          test -x "$LLVM/aarch64-linux-android35-clang++"
          test -x "$LLVM/aarch64-linux-android-gcc"
          test -x "$LLVM/aarch64-linux-android-g++"

          aarch64-linux-android-g++ --version

          haxelib run lime rebuild android

      - name: Build Android
        env:
          CXXFLAGS: "-O3 -std=c++20"
        run: |
          set -e

          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_DIR="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"

          LLVM="$ANDROID_NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$LLVM:$PATH"

          haxelib run lime build android -release -DGITHUB_BUILD

      - name: Locate APK
        run: |
          set -e

          mkdir -p artifacts

          APK="$(find export -type f -name "*.apk" -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ]; then
            APK="$(find . -type f -name "*.apk" -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$APK" ]; then
            echo "No APK was generated"
            find export -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK: $APK"
          cp "$APK" artifacts/Funkin-Moon.apk

      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Android
          path: artifacts/Funkin-Moon.apk


  ios:
    name: iOS
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify environment
        run: |
          set -e
          haxe --version
          haxelib version
          xcodebuild -version

      - name: Install HMM
        run: |
          set -e
          haxelib install hmm --quiet

      - name: Reset Haxelib
        run: |
          set -e
          rm -rf .haxelib
          haxelib run hmm install

      - name: Prepare hxcpp
        run: |
          set -e

          HXCPP_PATH=".haxelib/hxcpp/git"

          if [ ! -f "$HXCPP_PATH/tools/hxcpp/compile.hxml" ]; then
            echo "hxcpp compile.hxml was not found"
            exit 1
          fi

          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Rebuild Lime
        run: |
          set -e
          haxelib run lime rebuild cpp

      - name: Configure Lime iOS
        run: |
          set -e
          haxelib run lime setup ios || true

      - name: Build iOS
        run: |
          set -e
          haxelib run lime build ios -release -DGITHUB_BUILD

      - name: Package iOS
        run: |
          set -e

          mkdir -p artifacts

          APP="$(find export -type d -name "*.app" -print -quit 2>/dev/null || true)"
          IPA="$(find export -type f -name "*.ipa" -print -quit 2>/dev/null || true)"

          if [ -n "$IPA" ]; then
            cp "$IPA" artifacts/Funkin-Moon-iOS.ipa
          elif [ -n "$APP" ]; then
            cd "$(dirname "$APP")"
            zip -r "$OLDPWD/artifacts/Funkin-Moon-iOS.app.zip" "$(basename "$APP")"
          else
            echo "No iOS application was generated"
            find export -maxdepth 6 -type f 2>/dev/null || true
            find export -maxdepth 6 -type d -name "*.app" 2>/dev/null || true
            exit 1
          fi

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-iOS
          path: artifacts/*
