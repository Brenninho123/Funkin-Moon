name: Funkin-Moon Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funkin-moon-${{ github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: 4.3.7
  ANDROID_NDK_VERSION: 27.2.12479018
  CXXFLAGS: -O3 -std=c++20
  CFLAGS: -O3

jobs:

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            curl \
            zip \
            unzip \
            neko \
            libvlc-dev \
            libvlccore-dev \
            libdbus-1-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify toolchain
        run: |
          haxe --version
          haxelib version
          neko -version
          gcc --version
          g++ --version
          uname -m

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install Haxe dependencies
        run: |
          rm -rf .haxelib
          haxelib run hmm install

      - name: Prepare hxcpp
        run: |
          HXCPP_PATH=".haxelib/hxcpp/git"

          if [ ! -d "$HXCPP_PATH/tools/hxcpp" ]; then
            echo "hxcpp development source was not found."
            exit 1
          fi

          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Rebuild Lime
        run: |
          haxelib run lime rebuild cpp

      - name: Build Linux
        run: |
          haxelib run lime build linux -release -64 -DGITHUB_BUILD

      - name: Verify Linux
        run: |
          test -d export/release/linux/bin
          find export/release/linux/bin -maxdepth 2 -type f -print

      - name: Package Linux
        run: |
          cd export/release/linux/bin
          zip -9 -r ../../../../Funkin-Moon-Linux-x64.zip .

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Linux-x64
          path: Funkin-Moon-Linux-x64.zip
          if-no-files-found: error
          compression-level: 0


  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify toolchain
        shell: pwsh
        run: |
          haxe --version
          haxelib version
          gcc --version
          g++ --version

      - name: Install HMM
        shell: pwsh
        run: |
          haxelib install hmm

      - name: Install Haxe dependencies
        shell: pwsh
        run: |
          if (Test-Path ".haxelib") {
            Remove-Item ".haxelib" -Recurse -Force
          }

          haxelib run hmm install

      - name: Prepare hxcpp
        shell: pwsh
        run: |
          $HXCPP_PATH = ".haxelib/hxcpp/git"

          if (!(Test-Path "$HXCPP_PATH/tools/hxcpp")) {
            throw "hxcpp development source was not found."
          }

          Set-Location "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Rebuild Lime
        shell: pwsh
        run: |
          haxelib run lime rebuild cpp

      - name: Build Windows
        shell: pwsh
        run: |
          haxelib run lime build windows -release -64 -DGITHUB_BUILD

      - name: Verify Windows
        shell: pwsh
        run: |
          if (!(Test-Path "export/release/windows/bin")) {
            throw "Windows build output was not generated."
          }

          Get-ChildItem "export/release/windows/bin" -Recurse

      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "export/release/windows/bin/*" `
            -DestinationPath "Funkin-Moon-Windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Windows-x64
          path: Funkin-Moon-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0


  android:
    name: Android ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"

      - name: Detect Android NDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_SDK_ROOT}"
          NDK="${SDK}/ndk/${ANDROID_NDK_VERSION}"

          if [ ! -d "$NDK" ]; then
            echo "Android NDK was not found:"
            echo "$NDK"
            find "$SDK/ndk" -maxdepth 2 -type d 2>/dev/null || true
            exit 1
          fi

          if [ ! -f "$NDK/source.properties" ]; then
            echo "NDK source.properties was not found."
            exit 1
          fi

          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_DIR=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK"
          echo "Android NDK: $NDK"

      - name: Verify Android NDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_SDK=$ANDROID_SDK"
          echo "ANDROID_NDK_DIR=$ANDROID_NDK_DIR"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

          test -d "$ANDROID_NDK_DIR"
          test -f "$ANDROID_NDK_DIR/source.properties"

          LLVM="$ANDROID_NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -d "$LLVM"

          echo "LLVM directory:"
          ls -la "$LLVM" | head -40

          echo "Checking ARM64 compiler:"
          command -v aarch64-linux-android-g++ || true
          command -v aarch64-linux-android-clang++ || true
          command -v clang++ || true

          if [ -x "$LLVM/aarch64-linux-android-g++" ]; then
            "$LLVM/aarch64-linux-android-g++" --version
          elif [ -x "$LLVM/aarch64-linux-android-clang++" ]; then
            "$LLVM/aarch64-linux-android-clang++" --version
          else
            echo "No ARM64 Android compiler was found."
            exit 1
          fi

          "$ANDROID_NDK_DIR/ndk-build" --version

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            curl \
            zip \
            unzip \
            neko \
            libvlc-dev \
            libvlccore-dev \
            libdbus-1-dev \
            libxss-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libpulse-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Haxe
        run: |
          haxe --version
          haxelib version

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install Haxe dependencies
        run: |
          rm -rf .haxelib
          haxelib run hmm install

      - name: Prepare hxcpp
        run: |
          HXCPP_PATH=".haxelib/hxcpp/git"

          if [ ! -d "$HXCPP_PATH/tools/hxcpp" ]; then
            echo "hxcpp development source was not found."
            exit 1
          fi

          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Rebuild Lime C++
        run: |
          haxelib run lime rebuild cpp

      - name: Configure Lime Android
        shell: bash
        run: |
          set -e

          printf "n\n%s\n%s\n%s\n" \
            "$ANDROID_SDK" \
            "$ANDROID_NDK_DIR" \
            "$JAVA_HOME" | haxelib run lime setup android

          echo "ANDROID_SDK=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_DIR=$ANDROID_NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_DIR" >> "$GITHUB_ENV"

      - name: Revalidate Android paths
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_NDK_DIR"
          test -f "$ANDROID_NDK_DIR/source.properties"

          echo "ANDROID_NDK_DIR=$ANDROID_NDK_DIR"

          LLVM="$ANDROID_NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -d "$LLVM"

          export PATH="$LLVM:$PATH"

          if command -v aarch64-linux-android-g++ >/dev/null 2>&1; then
            aarch64-linux-android-g++ --version
          elif command -v aarch64-linux-android-clang++ >/dev/null 2>&1; then
            aarch64-linux-android-clang++ --version
          else
            echo "Android ARM64 compiler is unavailable."
            exit 1
          fi

      - name: Rebuild Lime Android
        shell: bash
        env:
          ANDROID_NDK_DIR: ${{ env.ANDROID_NDK_DIR }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          CXXFLAGS: -O3 -std=c++20
          CFLAGS: -O3
        run: |
          export PATH="$ANDROID_NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          test -d "$ANDROID_NDK_DIR"
          test -f "$ANDROID_NDK_DIR/source.properties"

          haxelib run lime rebuild android

      - name: Build Android
        shell: bash
        env:
          ANDROID_NDK_DIR: ${{ env.ANDROID_NDK_DIR }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          CXXFLAGS: -O3 -std=c++20
          CFLAGS: -O3
        run: |
          export PATH="$ANDROID_NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          haxelib run lime build android -release -DGITHUB_BUILD

      - name: Verify APK
        run: |
          find export -type f -name "*.apk" -print

      - name: Package Android
        run: |
          mkdir -p android-package
          find export -type f -name "*.apk" -exec cp {} android-package/ \;

          if [ -z "$(find android-package -type f -name "*.apk" -print -quit)" ]; then
            echo "No APK was generated."
            exit 1
          fi

          cd android-package
          zip -9 -r ../Funkin-Moon-Android.zip .

      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-Android
          path: Funkin-Moon-Android.zip
          if-no-files-found: error
          compression-level: 0


  ios:
    name: iOS x64
    runs-on: macos-15-intel
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Verify Apple toolchain
        run: |
          haxe --version
          haxelib version
          xcodebuild -version
          xcode-select -p
          uname -m

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install Haxe dependencies
        run: |
          rm -rf .haxelib
          haxelib run hmm install

      - name: Prepare hxcpp
        run: |
          HXCPP_PATH=".haxelib/hxcpp/git"

          if [ ! -d "$HXCPP_PATH/tools/hxcpp" ]; then
            echo "hxcpp development source was not found."
            exit 1
          fi

          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Rebuild Lime
        run: |
          haxelib run lime rebuild cpp

      - name: Setup Lime iOS
        run: |
          haxelib run lime setup ios

      - name: Build iOS
        env:
          CXXFLAGS: -O3 -std=c++20
          CFLAGS: -O3
        run: |
          haxelib run lime build ios -release -DGITHUB_BUILD

      - name: Verify iOS output
        run: |
          find export -type f -name "*.ipa" -print
          find export -type d -name "*.app" -print

      - name: Package iOS
        run: |
          rm -rf ios-package
          mkdir -p ios-package

          IPA=$(find export -type f -name "*.ipa" | head -n 1)

          if [ -n "$IPA" ]; then
            cp "$IPA" ios-package/
          else
            APP=$(find export -type d -name "*.app" | head -n 1)

            if [ -z "$APP" ]; then
              echo "No iOS application was generated."
              exit 1
            fi

            cp -R "$APP" ios-package/
          fi

          cd ios-package
          zip -9 -r ../Funkin-Moon-iOS.zip .

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Moon-iOS
          path: Funkin-Moon-iOS.zip
          if-no-files-found: error
          compression-level: 0
