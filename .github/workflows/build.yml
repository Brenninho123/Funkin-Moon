name: Funkin-Moon Android

on: push

jobs:
android:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: krdlab/setup-haxe@v2
    with:
      haxe-version: 4.3.7

  - name: Install Dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y libvlc-dev libvlccore-dev
      haxelib install hmm
      echo "HAXEPATH=$(haxelib config)" >> "$GITHUB_ENV"
      haxelib --global run hmm install

  - name: Setup Android
    uses: android-actions/setup-android@v3

  - name: Install NDK
    run: sdkmanager "ndk;27.2.12479018"

  - name: Setup Lime
    run: haxelib --always run lime setup

  - name: Build Android
    run: haxelib run lime build android -release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Funkin-Moon-Android
      path: export/android/**/*.apk
