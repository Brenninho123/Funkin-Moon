name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_clean_cache:
        description: Force clean caches (ignore existing haxelib/SDK cache)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: 4.3.7
  ANDROID_PLATFORM: platforms;android-35
  ANDROID_BUILD_TOOLS: build-tools;35.0.0
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
  CACHE_BUST: ${{ inputs.force_clean_cache == true && github.run_id || 'stable' }}

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Resolve short SHA
        shell: bash
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk-bundle
          sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK root
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$HOME/android-sdk/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-std=c++20" >> "$GITHUB_ENV"
      - name: Cache Android SDK
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools
            ${{ env.ANDROID_SDK_ROOT }}/platform-tools
            ${{ env.ANDROID_SDK_ROOT }}/platforms
            ${{ env.ANDROID_SDK_ROOT }}/build-tools
            ${{ env.ANDROID_SDK_ROOT }}/ndk
          key: android-sdk-${{ env.ANDROID_PLATFORM }}-${{ env.ANDROID_BUILD_TOOLS }}-${{ env.ANDROID_NDK_VERSION }}-${{ env.CACHE_BUST }}

      - name: Install Android cmdline-tools
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip "$ANDROID_CMDLINE_TOOLS_URL"
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm -f cmdline-tools.zip
      - name: Add Android tools to PATH
        shell: bash
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "$ANDROID_PLATFORM" \
            "$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK_VERSION"
      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            pkg-config
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install HMM
        shell: bash
        run: haxelib install hmm --quiet

      - name: Cache haxelib
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxelib-android-${{ hashFiles('hmm.json') }}-${{ env.CACHE_BUST }}
          restore-keys: |
            haxelib-android-
      - name: Install dependencies
        shell: bash
        run: haxelib run hmm install

      - name: Resolve hxcpp path
        shell: bash
        run: echo "HXCPP_PATH=$(haxelib libpath hxcpp | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Build hxcpp
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml
      - name: Rebuild Lime
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: haxelib run lime rebuild cpp

      - name: Setup Lime Android
        shell: bash
        run: |
          haxelib run lime setup android <<EOF
          $ANDROID_SDK_ROOT
          $ANDROID_NDK_ROOT
          $JAVA_HOME
          EOF
      - name: Rebuild Lime Android
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: haxelib run lime rebuild android

      - name: Build Android
        shell: bash
        run: haxelib run lime build android -release -DGITHUB_BUILD

      - name: Build summary
        shell: bash
        run: |
          {
            echo "### Android build"
            echo "Commit: $SHORT_SHA"
            du -h export/release/android/**/*.apk 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: funkin-moon-android-${{ env.SHORT_SHA }}
          path: export/release/android/**/*.apk
          if-no-files-found: error
          compression-level: 0

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Resolve short SHA
        shell: bash
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Haxe
        shell: bash
        run: |
          curl -fsSL -o haxe.tar.gz "https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-osx.tar.gz"
          tar -xzf haxe.tar.gz
          sudo mkdir -p /usr/local/lib/haxe
          sudo cp -R haxe-${HAXE_VERSION}-osx/* /usr/local/lib/haxe/
          sudo ln -sf /usr/local/lib/haxe/haxe /usr/local/bin/haxe
          sudo ln -sf /usr/local/lib/haxe/haxelib /usr/local/bin/haxelib
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"
          rm -f haxe.tar.gz
      - name: Install HMM
        shell: bash
        run: haxelib install hmm --quiet

      - name: Cache haxelib
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxelib-ios-${{ hashFiles('hmm.json') }}-${{ env.CACHE_BUST }}
          restore-keys: |
            haxelib-ios-
      - name: Install dependencies
        shell: bash
        run: haxelib run hmm install

      - name: Resolve hxcpp path
        shell: bash
        run: echo "HXCPP_PATH=$(haxelib libpath hxcpp | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Build hxcpp
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml
      - name: Rebuild Lime
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: haxelib run lime rebuild cpp

      - name: Rebuild Lime iOS
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: haxelib run lime rebuild ios

      - name: Build iOS
        shell: bash
        run: |
          haxelib run lime build ios -release -DGITHUB_BUILD -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build summary
        shell: bash
        run: |
          {
            echo "### iOS build"
            echo "Commit: $SHORT_SHA"
            du -sh export/release/ios/**/*.app 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: funkin-moon-ios-${{ env.SHORT_SHA }}
          path: export/release/ios/**/*.app
          if-no-files-found: error
          compression-level: 6

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Resolve short SHA
        shell: pwsh
        run: |
          $sha = (git rev-parse --short HEAD).Trim()
          "SHORT_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install HMM
        shell: pwsh
        run: haxelib install hmm --quiet

      - name: Cache haxelib
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxelib-windows-${{ hashFiles('hmm.json') }}-${{ env.CACHE_BUST }}
          restore-keys: |
            haxelib-windows-
      - name: Install dependencies
        shell: pwsh
        run: haxelib run hmm install

      - name: Resolve hxcpp path
        shell: pwsh
        run: |
          $hxcppPath = (haxelib libpath hxcpp).Trim()
          "HXCPP_PATH=$hxcppPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build hxcpp
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-Location "$env:HXCPP_PATH\tools\hxcpp"
          haxe compile.hxml
      - name: Rebuild Lime Windows
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: haxelib run lime rebuild cpp

      - name: Build Windows
        shell: pwsh
        run: haxelib run lime build windows -release -64 -DGITHUB_BUILD

      - name: Build summary
        shell: pwsh
        run: |
          "### Windows build`nCommit: $env:SHORT_SHA" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: funkin-moon-windows-${{ env.SHORT_SHA }}
          path: export/release/windows/bin
          if-no-files-found: error
          compression-level: 6

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Resolve short SHA
        shell: bash
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            pkg-config
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install HMM
        shell: bash
        run: haxelib install hmm --quiet

      - name: Cache haxelib
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxelib-linux-${{ hashFiles('hmm.json') }}-${{ env.CACHE_BUST }}
          restore-keys: |
            haxelib-linux-
      - name: Install dependencies
        shell: bash
        run: haxelib run hmm install

      - name: Resolve hxcpp path
        shell: bash
        run: echo "HXCPP_PATH=$(haxelib libpath hxcpp | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Build hxcpp
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml
      - name: Rebuild Lime Linux
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: haxelib run lime rebuild cpp

      - name: Build Linux
        shell: bash
        run: haxelib run lime build linux -release -64 -DGITHUB_BUILD

      - name: Build summary
        shell: bash
        run: |
          {
            echo "### Linux build"
            echo "Commit: $SHORT_SHA"
            du -sh export/release/linux/bin 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: funkin-moon-linux-${{ env.SHORT_SHA }}
          path: export/release/linux/bin
          if-no-files-found: error
          compression-level: 6
