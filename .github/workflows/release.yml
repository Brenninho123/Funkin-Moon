name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  HAXE_VERSION: 4.3.7
  RELEASE_TAG: v0.8.5.1-playtest

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Configure Android
        shell: bash
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-std=c++20" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            pkg-config

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install HMM
        shell: bash
        run: haxelib install hmm --quiet

      - name: Install dependencies
        shell: bash
        run: |
          rm -rf .haxelib
          haxelib run hmm install

      - name: Build hxcpp
        shell: bash
        run: |
          HXCPP_PATH=$(haxelib libpath hxcpp | tr -d '\n')
          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Rebuild Lime
        shell: bash
        run: haxelib run lime rebuild cpp

      - name: Setup Lime Android
        shell: bash
        run: |
          haxelib run lime setup android <<EOF
          $ANDROID_SDK_ROOT
          $ANDROID_NDK_ROOT
          $JAVA_HOME
          EOF

      - name: Rebuild Lime Android
        shell: bash
        run: haxelib run lime rebuild android

      - name: Build Android
        shell: bash
        run: haxelib run lime build android -release -DGITHUB_BUILD

      - name: Rename Android artifact
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=$(find export/release/android -maxdepth 3 -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "Could not find built APK"
            exit 1
          fi

          mkdir -p release-artifacts
          cp "$APK_PATH" "release-artifacts/Funkin-PlayTest-${{ env.RELEASE_TAG }}-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install HMM
        shell: bash
        run: haxelib install hmm --quiet

      - name: Install dependencies
        shell: bash
        run: |
          rm -rf .haxelib
          haxelib run hmm install

      - name: Build hxcpp
        shell: bash
        run: |
          HXCPP_PATH=$(haxelib libpath hxcpp | tr -d '\n')
          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Rebuild Lime
        shell: bash
        run: haxelib run lime rebuild cpp

      - name: Rebuild Lime iOS
        shell: bash
        run: haxelib run lime rebuild ios

      - name: Generate Xcode project
        shell: bash
        run: haxelib run lime update ios -release -DGITHUB_BUILD -DNO_FEATURE_CPPIA

      - name: Build iOS (unsigned)
        shell: bash
        run: |
          set -euo pipefail

          cd export/release/ios

          xcodebuild build \
            -project Funkin.xcodeproj \
            -target Funkin \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package iOS artifact
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=export/release/ios/build/Release-iphoneos

          cd "$BUILD_DIR"
          APP_PATH=$(find . -maxdepth 1 -name "*.app")

          if [ -z "$APP_PATH" ]; then
            echo "Could not find .app bundle in $BUILD_DIR"
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "Funkin-PlayTest-${{ env.RELEASE_TAG }}-ios.ipa" Payload

          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          cp "Funkin-PlayTest-${{ env.RELEASE_TAG }}-ios.ipa" "$GITHUB_WORKSPACE/release-artifacts/"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: release-artifacts/*.ipa
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-artifacts

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-release
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: release-artifacts/*
